<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Piano di Vendita – BUMPER</title>

  <style>
    body{
      background: radial-gradient(circle at 20% 20%, #10131a, #050609);
      color:#e8e8e8;
      font-family:"Inter", Arial, sans-serif;
      padding:25px;
      margin:0;
    }

    .menu{
      position:absolute;
      top:20px;
      right:30px;
      display:flex;
      gap:14px;
    }
    .pill{
      padding:10px 20px;
      border:2px solid #6bb6ff;
      border-radius:30px;
      color:#b7d9ff;
      text-decoration:none;
      font-weight:600;
      transition:0.25s;
      backdrop-filter: blur(6px);
      background:rgba(10,15,25,0.6);
    }
    .pill:hover{
      background:#6bb6ff33;
      border-color:#ffffff;
      color:white;
    }
    .pill.active{
      background:#6bb6ff55;
      border-color:white;
      color:white;
      cursor:default;
    }

    h1{
      display:flex;
      align-items:center;
      gap:15px;
      font-size:32px;
      font-weight:800;
      letter-spacing:0.5px;
      margin-top:10px;
      margin-bottom:25px;
    }
    #logo{
      width:70px;
      height:70px;
      border-radius:16px;
      background:#111;
      box-shadow:0 0 18px rgba(0,0,0,0.6);
    }

    #pianoVendita{
      background: linear-gradient(135deg, #ffffff11, #ffffff05);
      border:1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius:18px;
      padding:25px;
      box-shadow:0 4px 20px rgba(0,0,0,0.4);
      margin-bottom:25px;
      display:flex;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:20px;
    }

    .semaforo-dot{
      width:14px;
      height:14px;
      border-radius:50%;
      display:inline-block;
      margin-right:6px;
    }

    .green{color:#4aff8a;font-weight:700;}
    .red{color:#ff5c5c;font-weight:700;}
    .yellow{color:#ffd86b;font-weight:700;}
  </style>
</head>

<body>

  <div class="menu">
    <a class="pill" href="index.html">Dashboard</a>
    <a class="pill" href="vendita.html">Vendita</a>
    <a class="pill active" href="piano.html">Piano</a>
  </div>

  <h1>
    <img id="logo" src="logo.png">
    <span>Piano di Vendita</span>
  </h1>

  <div id="pianoVendita">
    <div>
      <div style="font-size:22px;font-weight:900;color:#ff5c5c">Piano di vendita (basso impatto)</div>
      <div id="safeSellTop" style="font-size:34px;font-weight:900;color:#4aff8a;margin-top:8px">–</div>
      <div style="font-size:20px;font-weight:900;color:#4aff8a">BUMPER totali</div>
      <div id="riskLabel" style="margin-top:12px;font-size:16px;font-weight:900;color:#1b1f27">
        <span id="riskDot" class="semaforo-dot" style="background:#999"></span>Rischio: –
      </div>
    </div>

    <div style="text-align:right">
      <div style="font-size:20px;font-weight:900;color:#e8e8e8">
        Equivalente: <span id="safeSellUSDC" style="color:#4aff8a">–</span> USDC
      </div>
      <div style="font-size:18px;margin-top:10px;color:#c0c6d8;font-weight:900">
        DCA: <span id="dcaCount">–</span> × <span id="dcaTranche">–</span>
      </div>
      <div style="font-size:16px;margin-top:10px;color:#a5aec4;font-weight:900">
        Impatto per tranche: <span id="impactPerTranche">–</span>
      </div>
      <div style="font-size:13px;margin-top:10px;color:#9aa3b8">
        Prezzo dopo tranche: <span id="estimatedPrice">–</span>
      </div>
    </div>
  </div>

  <script>
    function loadFromStorage(){
      let price = parseFloat(localStorage.getItem("globalPrice")||0);
      let liq   = parseFloat(localStorage.getItem("globalLiquidity")||0);
      let impact= parseFloat(localStorage.getItem("planImpact")||0);
      let safe  = parseFloat(localStorage.getItem("planSafeSell")||0);
      let tr    = parseFloat(localStorage.getItem("planTranche")||0);
      let trancheB = parseFloat(localStorage.getItem("planTrancheB")||0);

      if(!price || !liq){
        return;
      }

      document.getElementById("safeSellTop").textContent = safe.toLocaleString();
      document.getElementById("safeSellUSDC").textContent = "$"+(safe*price).toFixed(2);
      document.getElementById("dcaCount").textContent = tr;
      document.getElementById("dcaTranche").textContent = trancheB.toLocaleString();
      document.getElementById("impactPerTranche").innerHTML =
        (impact>=0 ? `<span class='green'>${impact.toFixed(2)}%</span>` :
                     `<span class='red'>${impact.toFixed(2)}%</span>`);

      document.getElementById("estimatedPrice").textContent =
        "$"+(price*(1-impact/100)).toFixed(8);

      let dot=document.getElementById("riskDot");
      dot.style.background = impact>=0.75 ? "#ff5c5c" :
                             impact>=0.25 ? "#ffd86b" : "#4aff8a";

      document.getElementById("riskLabel").innerHTML =
        `<span class="semaforo-dot" style="background:${dot.style.background}"></span>`+
        `Rischio: ${impact>=0.75?"Alto":impact>=0.25?"Medio":"Basso"}`;
    }

    loadFromStorage();
  </script>

</body>
</html>
