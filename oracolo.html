<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>BUMPER OS – Technical Oracle</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #05060b; --card-bg: rgba(13, 17, 28, 0.9); --accent: #a855f7; --green: #4aff8a; --red: #ff5c5c; --border: rgba(255, 255, 255, 0.1); }
    body { background: #05060b; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 20px; }
    
    .menu { display: flex; justify-content: flex-end; gap: 12px; padding-bottom: 30px; }
    .pill { padding: 10px 22px; border: 1px solid var(--border); border-radius: 12px; color: #94a3b8; text-decoration: none; font-weight: 700; font-size: 13px; background: rgba(255, 255, 255, 0.03); transition: 0.3s; }
    .pill.active { background: var(--accent); color: #fff; border-color: #fff; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 35px; max-width: 850px; margin: 0 auto; }
    
    .header-tech { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; }
    .verdict-text { font-family: 'JetBrains Mono'; font-size: 32px; font-weight: 800; text-transform: uppercase; margin: 10px 0; }

    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 25px 0; }
    .m-card { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
    .m-label { font-size: 9px; color: #64748b; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
    .m-value { font-family: 'JetBrains Mono'; font-size: 18px; font-weight: 700; }

    /* REAL TERMINAL LOG */
    .terminal-header { background: #1a1f35; padding: 8px 15px; border-radius: 10px 10px 0 0; font-family: 'JetBrains Mono'; font-size: 10px; color: #64748b; border: 1px solid var(--border); border-bottom: none; display: flex; justify-content: space-between; }
    .terminal-body { background: #000; border-radius: 0 0 10px 10px; padding: 20px; font-family: 'JetBrains Mono'; font-size: 11px; color: #4aff8a; text-align: left; height: 180px; overflow-y: auto; border: 1px solid var(--border); line-height: 1.5; }
    
    .green { color: var(--green); } .red { color: var(--red); } .purple { color: var(--accent); }
    .dim { color: #64748b; }
  </style>
</head>
<body>

  <nav class="menu">
    <a href="index.html" class="pill">TERMINAL</a>
    <a href="vendita.html" class="pill">STRATEGY</a>
    <a href="piano.html" class="pill">PLAN</a>
    <a href="oracolo.html" class="pill active">ORACOLO</a>
  </nav>

  <div class="card">
    <div class="header-tech">
      <div style="font-size: 10px; font-weight: 800; color: #64748b; letter-spacing: 2px;">QUANTITATIVE ANALYSIS ENGINE</div>
      <div id="verdict" class="verdict-text">INITIALIZING...</div>
      <div id="sub-verdict" style="font-size: 13px; color: #94a3b8;">Calcolo indicatori di rischio basati su Liquidità e Slippage</div>
    </div>

    <div class="metrics-grid">
      <div class="m-card">
        <div class="m-label">Liq/Mcap Ratio</div>
        <div id="liqRatio" class="m-value">--</div>
      </div>
      <div class="m-card">
        <div class="m-label">1% Depth (Est.)</div>
        <div id="depth" class="m-value">--</div>
      </div>
      <div class="m-card">
        <div class="m-label">Volatility Risk</div>
        <div id="volRisk" class="m-value">--</div>
      </div>
    </div>

    <div class="terminal-header">
      <span>REAL-TIME COMPUTATION LOG</span>
      <span id="log-status">ACTIVE</span>
    </div>
    <div class="terminal-body" id="log">
      > In attesa di dati dal Terminale...
    </div>
  </div>

  <script>
    function updateLog(msg) {
      const log = document.getElementById("log");
      const time = new Date().toLocaleTimeString();
      log.innerHTML += `<div style="margin-bottom:4px"><span class="dim">[${time}]</span> ${msg}</div>`;
      log.scrollTop = log.scrollHeight;
    }

    function consultOracle() {
      const price = parseFloat(localStorage.getItem("globalPrice") || 0);
      const liq = parseFloat(localStorage.getItem("globalLiquidity") || 0);
      
      if (price === 0 || liq === 0) return;

      const log = document.getElementById("log");
      log.innerHTML = ""; // Pulisce per mostrare calcoli reali correnti

      updateLog("Fetch dati completato.");
      
      // 1. Calcolo Slippage Reale (quanto sposta il prezzo una vendita da 1000$)
      const testAmount = 1000;
      const poolSide = liq / 2;
      const slippage1k = (testAmount / poolSide) * 100;
      updateLog(`Calcolo Price Impact (1k USD): <span class="purple">${slippage1k.toFixed(4)}%</span>`);

      // 2. Calcolo 1% Depth (quanti $ servono per muovere il prezzo dell'1%)
      const depth1perc = poolSide * 0.01;
      document.getElementById("depth").textContent = "$" + depth1perc.toLocaleString(undefined, {maximumFractionDigits:0});
      updateLog(`Calcolo 1% Depth: <span class="purple">$${depth1perc.toFixed(2)}</span>`);

      // 3. Rapporto Liquidità / Prezzo (Indicatori di salute)
      // Usiamo una formula semplificata del Mcap se non abbiamo la supply
      const liqHealth = (liq > 200000) ? "STABLE" : "THIN";
      document.getElementById("liqRatio").textContent = liqHealth;

      // 4. Calcolo Rischio Volatilità
      let riskScore = "LOW";
      let riskColor = "green";
      if (slippage1k > 0.1) { riskScore = "MEDIUM"; riskColor = "purple"; }
      if (slippage1k > 0.5) { riskScore = "HIGH"; riskColor = "red"; }
      document.getElementById("volRisk").textContent = riskScore;
      document.getElementById("volRisk").className = "m-value " + riskColor;

      // Verdetto Tecnico
      const v = document.getElementById("verdict");
      if (slippage1k < 0.05) {
        v.textContent = "HIGH LIQUIDITY";
        v.className = "verdict-text green";
        updateLog("Analisi terminata: Asset altamente liquido. Esecuzione trade sicura.");
      } else if (slippage1k < 0.2) {
        v.textContent = "MODERATE RISK";
        v.className = "verdict-text purple";
        updateLog("Analisi terminata: Liquidità sufficiente per piccoli trade. Attenzione a ordini > $5k.");
      } else {
        v.textContent = "LOW LIQUIDITY";
        v.className = "verdict-text red";
        updateLog("WARNING: Slippage elevato rilevato. Rischio volatilità estrema.");
      }
    }

    window.addEventListener('storage', consultOracle);
    window.onload = consultOracle;
  </script>
</body>
</html>
