<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>BUMPER OS – L'Oracolo</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #05060b; --card-bg: rgba(13, 17, 28, 0.8); --accent: #a855f7; --green: #4aff8a; --red: #ff5c5c; --border: rgba(255, 255, 255, 0.08); }
    body { background: radial-gradient(circle at top right, #1a1f35, #05060b 60%); color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 20px; line-height: 1.6; }
    
    .menu { display: flex; justify-content: flex-end; gap: 12px; padding-bottom: 30px; }
    .pill { padding: 10px 22px; border: 1px solid var(--border); border-radius: 12px; color: #94a3b8; text-decoration: none; font-weight: 700; font-size: 13px; transition: 0.3s; background: rgba(255, 255, 255, 0.03); }
    .pill:hover { border-color: var(--accent); color: #fff; }
    .pill.active { background: var(--accent); color: #fff; border-color: #fff; box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; padding: 35px; max-width: 800px; margin: 0 auto; backdrop-filter: blur(20px); text-align: center; }
    
    .oracle-sphere { width: 100px; height: 100px; background: radial-gradient(circle, var(--accent), transparent 70%); border-radius: 50%; margin: 0 auto 20px; filter: blur(15px); animation: pulse 3s infinite; box-shadow: 0 0 50px var(--accent); }
    @keyframes pulse { 0% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.2); } 100% { opacity: 0.4; transform: scale(1); } }

    .verdict-box { margin: 25px 0; padding: 25px; border-radius: 20px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); position: relative; overflow: hidden; }
    .verdict-text { font-size: 32px; font-weight: 900; margin: 10px 0; letter-spacing: -1px; text-transform: uppercase; }

    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 30px; }
    .metric-card { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; border: 1px solid var(--border); text-align: center; }
    .metric-label { font-size: 9px; color: #64748b; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
    .metric-value { font-family: 'JetBrains Mono'; font-size: 14px; font-weight: 700; }

    .gauge-bar { width: 100%; height: 6px; background: #1a1f35; border-radius: 10px; margin-top: 10px; overflow: hidden; }
    .gauge-fill { height: 100%; background: var(--accent); width: 0%; transition: 1s ease-out; }

    .advice-note { margin-top: 30px; padding: 20px; background: rgba(168, 85, 247, 0.05); border-radius: 12px; font-size: 14px; border-left: 4px solid var(--accent); text-align: left; }
    
    .green { color: var(--green); } .red { color: var(--red); } .purple { color: var(--accent); }
  </style>
</head>
<body>

  <nav class="menu">
    <a href="index.html" class="pill">TERMINAL</a>
    <a href="vendita.html" class="pill">STRATEGY</a>
    <a href="piano.html" class="pill">PLAN</a>
    <a href="oracolo.html" class="pill active">ORACOLO</a>
  </nav>

  <div class="card">
    <div class="oracle-sphere"></div>
    <h1 style="margin:0; font-size:28px; font-weight:900; letter-spacing: -1px;">SISTEMA <span class="purple">ORACOLO</span> V2</h1>
    
    <div class="verdict-box">
      <div id="verdict" class="verdict-text">CONNETTENDO...</div>
      <div id="confidence" style="font-size:12px; font-weight:700; color: #64748b;">Analisi flussi in corso</div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Resistenza Dump</div>
        <div id="dumpResistance" class="metric-value">--</div>
        <div class="gauge-bar"><div id="dumpFill" class="gauge-fill"></div></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Buy Pressure</div>
        <div id="buyPressure" class="metric-value">--</div>
        <div class="gauge-bar"><div id="buyFill" class="gauge-fill"></div></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Rischio Whale</div>
        <div id="whaleRisk" class="metric-value">--</div>
        <div class="gauge-bar"><div id="whaleFill" class="gauge-fill"></div></div>
      </div>
    </div>

    <div id="advice" class="advice-note">
      L'Oracolo richiede i dati del Terminale per manifestarsi...
    </div>
  </div>

  <script>
    function consultOracle() {
      const price = parseFloat(localStorage.getItem("globalPrice") || 0);
      const liq = parseFloat(localStorage.getItem("globalLiquidity") || 0);
      
      if (price === 0) {
        document.getElementById("verdict").textContent = "OFFLINE";
        return;
      }

      // 1. Calcolo Resistenza al Dump (basato sulla profondità della liquidità)
      const resScore = Math.min(100, (liq / 500000) * 100);
      document.getElementById("dumpResistance").textContent = resScore.toFixed(0) + "%";
      document.getElementById("dumpFill").style.width = resScore + "%";

      // 2. Calcolo Whale Risk (Se la liq è bassa rispetto al market cap simulato)
      const whaleRisk = Math.max(0, 100 - (liq / 200000 * 100));
      document.getElementById("whaleRisk").textContent = whaleRisk.toFixed(0) + "%";
      document.getElementById("whaleFill").style.width = whaleRisk + "%";
      document.getElementById("whaleFill").style.background = whaleRisk > 60 ? 'var(--red)' : 'var(--accent)';

      // 3. Verdetto Finale
      const v = document.getElementById("verdict");
      const a = document.getElementById("advice");

      if (resScore > 70 && whaleRisk < 30) {
        v.textContent = "Fortezza Inviolabile";
        v.className = "verdict-text green";
        a.innerHTML = "<b>Profezia:</b> Il pavimento è solido. Le balene hanno paura di vendere perché verrebbero riassorbite immediatamente. Ottimo momento per holding.";
      } else if (resScore > 40) {
        v.textContent = "Equilibrio Instabile";
        v.className = "verdict-text purple";
        a.innerHTML = "<b>Profezia:</b> Il mercato respira. Non c'è una direzione chiara. Aspetta un segnale di volume dal Terminale prima di muoverti.";
      } else {
        v.textContent = "Sabbie Mobili";
        v.className = "verdict-text red";
        a.innerHTML = "<b>Profezia:</b> Attenzione. La liquidità è sottile come ghiaccio. Una singola vendita di medie dimensioni potrebbe innescare una reazione a catena.";
      }
    }

    window.addEventListener('storage', consultOracle);
    window.onload = consultOracle;
  </script>
</body>
</html>
