<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>BUMPER OS – DCA Strategy Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #05060b; --card-bg: rgba(13, 17, 28, 0.7); --accent: #6bb6ff; --green: #4aff8a; --red: #ff5c5c; --border: rgba(255, 255, 255, 0.08); }
    body { background: radial-gradient(circle at top right, #1a1f35, #05060b 60%); color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 20px; }
    .menu { display: flex; justify-content: flex-end; gap: 12px; padding: 15px 0; }
    .pill { padding: 10px 22px; border: 1px solid var(--border); border-radius: 12px; color: #94a3b8; text-decoration: none; font-weight: 700; font-size: 13px; transition: 0.3s; background: rgba(255, 255, 255, 0.03); }
    .pill.active { background: var(--accent); color: #000; border-color: #fff; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 30px; max-width: 850px; margin: 20px auto; backdrop-filter: blur(10px); }
    .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
    label { font-size: 10px; color: #64748b; font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 8px; letter-spacing: 1px; }
    input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: #fff; font-family: 'JetBrains Mono'; outline: none; box-sizing: border-box; }
    
    /* STILE DEL BOLLINO */
    .status-tag { padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 900; letter-spacing: 1px; display: inline-block; }
    .tag-safe { background: rgba(74, 255, 138, 0.1); color: var(--green); border: 1px solid var(--green); }
    .tag-risk { background: rgba(255, 92, 92, 0.2); color: var(--red); border: 1px solid var(--red); box-shadow: 0 0 15px rgba(255,92,92,0.2); }
    
    .tech-note { background: rgba(0, 0, 0, 0.25); border-left: 3px solid var(--accent); border-radius: 8px; padding: 15px; margin-bottom: 25px; font-size: 13px; color: #94a3b8; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; color: #64748b; padding-bottom: 12px; font-size: 10px; }
    td { padding: 12px 0; border-top: 1px solid var(--border); font-family: 'JetBrains Mono'; }
    .green { color: var(--green); } .red { color: var(--red); }
  </style>
</head>
<body>
  <div class="menu">
    <a href="index.html" class="pill">TERMINAL</a>
    <a href="vendita.html" class="pill active">STRATEGY</a>
    <a href="piano.html" class="pill">PLAN</a>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px">
        <h2 style="margin:0; font-weight: 900;">DCA Exit Simulator</h2>
        <div id="strategyRating" class="status-tag" style="background: rgba(255,255,255,0.05); color: #64748b;">INSERISCI DATI</div>
    </div>

    <div class="input-group">
      <div>
        <label>Totale BUMPER da liquidare</label>
        <input id="totalToSell" type="number" placeholder="Es. 2500000" oninput="runSim()">
      </div>
      <div>
        <label>Numero Tranche (DCA Step)</label>
        <input id="numTranches" type="number" placeholder="Es. 16" oninput="runSim()">
      </div>
    </div>

    <div id="simulationResult" style="display:none">
      <div class="tech-note">
        <span style="font-size: 11px; font-weight: 800; color: var(--accent); display: block; margin-bottom: 5px;">LIVE ANALYSIS</span>
        Impatto totale stimato: <b id="totalImpact" class="red">0.00%</b>. 
        Prezzo finale: <b id="endPrice" style="color:white">$0.00</b>
      </div>
      <table id="dcaTable">
        <thead><tr><th>Step</th><th>Size BP</th><th>Impact/Step</th><th>Price Post</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    function runSim() {
      const total = parseFloat(document.getElementById("totalToSell").value);
      const tranches = parseInt(document.getElementById("numTranches").value);
      
      // Recupero dati da LocalStorage (assicurati che index.html sia aperto in un'altra scheda)
      const price = parseFloat(localStorage.getItem("globalPrice") || 0);
      const liq = parseFloat(localStorage.getItem("globalLiquidity") || 0);

      if (total > 0 && tranches > 0 && price > 0 && liq > 0) {
        document.getElementById("simulationResult").style.display = "block";
        localStorage.setItem("userBumperBalance", total);
        
        const tbody = document.querySelector("#dcaTable tbody");
        tbody.innerHTML = "";
        
        let currentPrice = price;
        const sizePerStep = total / tranches;
        
        // Calcolo impatto del primo step per determinare il rating
        const firstStepUsdc = sizePerStep * price;
        const impactPerStep = (firstStepUsdc / (liq / 2)) * 100;

        const rating = document.getElementById("strategyRating");
        
        // LOGICA DEL BOLLINO
        if(impactPerStep > 0.15) {
          rating.textContent = "STRATEGIA AGGRESSIVA";
          rating.className = "status-tag tag-risk";
        } else {
          rating.textContent = "STRATEGIA OTTIMIZZATA";
          rating.className = "status-tag tag-safe";
        }

        // Generazione Tabella
        for (let i = 1; i <= tranches; i++) {
          let stepUsdc = sizePerStep * currentPrice;
          let stepImpact = (stepUsdc / (liq / 2)) * 100;
          currentPrice = currentPrice * (1 - stepImpact / 100);
          
          tbody.innerHTML += `
            <tr>
              <td>#${i}</td>
              <td>${Math.floor(sizePerStep).toLocaleString()}</td>
              <td class="${stepImpact > 0.15 ? 'red' : 'green'}">${stepImpact.toFixed(3)}%</td>
              <td>$${currentPrice.toFixed(8)}</td>
            </tr>`;
        }

        document.getElementById("endPrice").textContent = "$" + currentPrice.toFixed(8);
        const totalImpactPerc = ((price - currentPrice) / price) * 100;
        document.getElementById("totalImpact").textContent = totalImpactPerc.toFixed(2) + "%";
        document.getElementById("totalImpact").className = totalImpactPerc > 3 ? "red" : "green";
      }
    }

    // Esegui sim all'avvio se ci sono già dati salvati
    window.onload = runSim;
  </script>
</body>
</html>
