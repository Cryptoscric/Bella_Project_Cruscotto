<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>BUMPER OS – Strategy Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #05060b; --card-bg: rgba(13, 17, 28, 0.7); --accent: #6bb6ff; --green: #4aff8a; --red: #ff5c5c; --border: rgba(255, 255, 255, 0.08); }
    body { background: radial-gradient(circle at top right, #1a1f35, #05060b 60%); color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 20px; }
    .menu { display: flex; justify-content: flex-end; gap: 12px; padding: 15px 0; }
    .pill { padding: 10px 22px; border: 1px solid var(--border); border-radius: 12px; color: #94a3b8; text-decoration: none; font-weight: 700; font-size: 13px; transition: 0.3s; }
    .pill.active { background: var(--accent); color: #000; border-color: #fff; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 30px; max-width: 600px; margin: 40px auto; backdrop-filter: blur(10px); }
    input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: #fff; font-family: 'JetBrains Mono'; margin: 10px 0; box-sizing: border-box; }
    .quick-btn { padding: 8px 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; border-radius: 8px; cursor: pointer; margin-right: 5px; }
    .result-box { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 15px; border: 1px solid var(--border); margin-top: 20px; }
    .green { color: var(--green); } .red { color: var(--red); }
  </style>
</head>
<body>
  <div class="menu">
    <a href="index.html" class="pill">TERMINAL</a>
    <a href="vendita.html" class="pill active">STRATEGY</a>
    <a href="piano.html" class="pill">PLAN</a>
  </div>

  <div class="card">
    <span style="text-transform:uppercase; color:var(--accent); font-weight:800; font-size:12px">Exit Strategy Simulator</span>
    <h2 style="margin: 10px 0 30px 0">Simulatore Vendita</h2>

    <label style="font-size:11px; color:#64748b">IL TUO SALDO (BUMPER)</label>
    <input id="userBalance" type="number" placeholder="0.00" oninput="saveBalance()">

    <label style="font-size:11px; color:#64748b">QUANTITÀ DA VENDERE</label>
    <input id="sellInput" type="number" placeholder="0.00" oninput="calculate()">
    
    <div style="margin-bottom:20px">
      <button class="quick-btn" onclick="setQuick(25)">25%</button>
      <button class="quick-btn" onclick="setQuick(50)">50%</button>
      <button class="quick-btn" onclick="setQuick(100)">MAX</button>
    </div>

    <div id="results" class="result-box" style="display:none">
      <div style="display:flex; justify-content:space-between; margin-bottom:10px">
        <span>Valore Stimato:</span><span id="resUSDC" class="green">--</span>
      </div>
      <div style="display:flex; justify-content:space-between; margin-bottom:10px">
        <span>Impatto Prezzo:</span><span id="resImpact">--</span>
      </div>
      <div style="display:flex; justify-content:space-between; border-top:1px solid var(--border); pt-10; margin-top:10px">
        <span style="font-size:12px; color:#64748b">Prezzo Post-Vendita:</span><span id="resNewPrice" style="font-size:12px">--</span>
      </div>
    </div>
  </div>

  <script>
    let price = 0, liq = 0;

    function sync() {
      price = parseFloat(localStorage.getItem("globalPrice") || 0);
      liq = parseFloat(localStorage.getItem("globalLiquidity") || 0);
      if(document.getElementById("sellInput").value) calculate();
    }

    function saveBalance() {
      localStorage.setItem("userBumperBalance", document.getElementById("userBalance").value);
      calculate();
    }

    function setQuick(p) {
      const bal = parseFloat(document.getElementById("userBalance").value || 0);
      document.getElementById("sellInput").value = (bal * p / 100).toFixed(2);
      calculate();
    }

    function calculate() {
      const amt = parseFloat(document.getElementById("sellInput").value || 0);
      const resDiv = document.getElementById("results");
      
      if(amt > 0 && price > 0) {
        resDiv.style.display = "block";
        const usd = amt * price;
        const impact = (usd / (liq / 2)) * 100; // Modello XYK semplificato
        
        document.getElementById("resUSDC").textContent = "$" + usd.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById("resImpact").textContent = impact.toFixed(2) + "%";
        document.getElementById("resImpact").className = impact > 1 ? "red" : "green";
        document.getElementById("resNewPrice").textContent = "$" + (price * (1 - impact/100)).toFixed(8);
      } else {
        resDiv.style.display = "none";
      }
    }

    window.onload = () => {
      document.getElementById("userBalance").value = localStorage.getItem("userBumperBalance") || "";
      sync();
      setInterval(sync, 5000);
    };
  </script>
</body>
</html>
  </script>

</body>
</html>
