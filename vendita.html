<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Vendita Personalizzata – BUMPER</title>

  <style>
    body {
      background:#0b0d10;
      color:#e6e6e6;
      font-family:Arial;
      padding:25px;
      margin:0;
    }

    /* MENU IN ALTO A DESTRA */
    .menu {
      position:absolute;
      top:20px;
      right:30px;
      display:flex;
      gap:12px;
    }

    .pill {
      padding:8px 16px;
      border:2px solid #9ecbff;
      border-radius:20px;
      color:#9ecbff;
      text-decoration:none;
      font-weight:bold;
      transition:0.2s;
    }

    .pill:hover {
      background:#9ecbff22;
      color:white;
      border-color:white;
    }

    /* PULSANTE ATTIVO */
    .active {
      border-color:white !important;
      color:white !important;
      background:#9ecbff22;
      cursor:default;
    }

    /* HEADER */
    h1 {
      display:flex;
      align-items:center;
      gap:15px;
      font-size:28px;
      font-weight:bold;
    }

    #logo {
      width:70px;
      height:70px;
      border-radius:10px;
      background:#111;
    }

    /* CARD */
    .card {
      background:#161a20;
      padding:20px;
      border-radius:12px;
      margin-bottom:20px;
      border:1px solid #222;
    }

    .input-box {
      width:100%;
      padding:10px;
      border-radius:8px;
      border:1px solid #444;
      background:#222;
      color:white;
      font-size:16px;
      margin-bottom:10px;
    }

    .quick-btn {
      padding:8px 14px;
      margin-right:8px;
      background:#333;
      border:1px solid #555;
      border-radius:6px;
      color:white;
      cursor:pointer;
      font-weight:bold;
    }

    .update-btn {
      padding:10px 18px;
      background:#00cc33;
      border:none;
      border-radius:8px;
      color:black;
      font-weight:bold;
      cursor:pointer;
    }

    .green { color:#00cc33; font-weight:bold; }
    .red { color:#ff3333; font-weight:bold; }

    .sparkline {
      width:120px;
      height:30px;
      background:#111;
      border-radius:6px;
      margin-top:8px;
    }
  </style>
</head>

<body>

  <!-- MENU -->
  <div class="menu">
    <a href="index.html" class="pill">Dashboard</a>
    <a href="vendita.html" class="pill active">Vendita</a>
  </div>

  <!-- HEADER -->
  <h1>
    <img id="logo" src="logo.png">
    <span>Vendita Personalizzata</span>
  </h1>

  <!-- CARD VENDITA PERSONALIZZATA -->
  <div class="card">
    <h2>Vendita Personalizzata</h2>

    <label>Quanti BUMPER possiedi?</label>
    <input id="userBalance" class="input-box" type="number" placeholder="Inserisci saldo">
    <button class="update-btn" onclick="updateUserBalance()">Aggiorna</button>

    <hr style="border-color:#333;margin:20px 0">

    <label>Quanti BUMPER vuoi vendere?</label>
    <input id="customSellInput" class="input-box" type="number" oninput="updateCustomSell()">
    <input id="customSlider" type="range" min="0" max="100" value="0" style="width:100%" oninput="sliderChanged()">

    <div style="margin-top:10px">
      <button class="quick-btn" onclick="quickSell(10)">10%</button>
      <button class="quick-btn" onclick="quickSell(25)">25%</button>
      <button class="quick-btn" onclick="quickSell(50)">50%</button>
      <button class="quick-btn" onclick="quickSell(100)">100%</button>
    </div>

    <div style="margin-top:20px;font-size:16px">
      <div>USDC ottenuti: <span id="customUSDC" class="green">–</span></div>
      <div>Impatto stimato: <span id="customImpact">–</span></div>
      <div>Tranche consigliate: <span id="customTranche" class="green">–</span></div>
      <div>Per restare in verde: <span id="customGreenTranche" class="green">–</span></div>
      <div>Confronto con piano ottimale: <span id="customDiff">–</span></div>
      <div style="margin-top:10px;font-size:13px">Prezzo dopo vendita: <span id="customPrice">–</span></div>
      <canvas id="sparkline" class="sparkline"></canvas>
    </div>
  </div>

  <!-- SCRIPT (solo funzioni necessarie) -->
  <script>
    let userBalance=0, globalPrice=0, globalLiquidity=0, planImpact=0;

    function fmtUsd(v){
      if(!v)return"–";
      v=+v;
      return v<1?"$"+v.toFixed(2):"$"+v.toLocaleString();
    }

    function signed(v){
      if(v===null||isNaN(v))return"–";
      let pos=v>=0;
      let txt=v.toFixed(2)+"% "+(pos?"(sotto soglia)":"(sopra soglia)");
      return `<span style="color:${pos?"#00cc33":"#ff3333"};font-weight:bold">${txt}</span>`;
    }

    function updateUserBalance(){
      userBalance=+document.getElementById("userBalance").value;
      updateCustomSell();
    }

    function sliderChanged(){
      if(!userBalance)return;
      customSellInput.value=Math.floor(userBalance*(+customSlider.value)/100);
      updateCustomSell();
    }

    function quickSell(p){
      if(!userBalance)return;
      customSellInput.value=Math.floor(userBalance*p/100);
      customSlider.value=p;
      updateCustomSell();
    }

    function drawSpark(c,val){
      let x=c.getContext("2d");
      x.clearRect(0,0,c.width,c.height);
      if(!val||isNaN(val))return;
      let max=1.5,y=c.height-(Math.min(val,max)/max)*c.height;
      x.strokeStyle=val>=0.75?"#ff3333":val>=0.25?"#ffcc00":"#00cc33";
      x.lineWidth=2;
      x.beginPath();x.moveTo(5,y);x.lineTo(c.width-5,y);x.stroke();
    }

    function updateCustomSell(){
      let amt=+customSellInput.value;
      if(!amt||!globalPrice||!globalLiquidity){
        customUSDC.textContent="–";
        customImpact.innerHTML="–";
        customTranche.textContent="–";
        customGreenTranche.textContent="–";
        customDiff.innerHTML="–";
        customPrice.textContent="–";
        drawSpark(sparkline,null);
        return;
      }

      let usd=amt*globalPrice;
      let impact=usd/globalLiquidity*100;

      customUSDC.textContent=fmtUsd(usd);
      customImpact.innerHTML=signed(impact);

      let tr=Math.max(1,Math.ceil(impact/0.25));
      customTranche.textContent=tr;
      customGreenTranche.textContent=tr;

      let diff=impact-planImpact;
      customDiff.innerHTML=signed(diff);

      customPrice.textContent="$"+(globalPrice*(1-impact/100)).toFixed(8);
      drawSpark(sparkline,impact);
    }

    /* IMPORTA I DATI DALLA DASHBOARD */
    fetch("index.html")  
      .then(()=>{  
        globalPrice = parseFloat(localStorage.getItem("globalPrice")||0);
        globalLiquidity = parseFloat(localStorage.getItem("globalLiquidity")||0);
        planImpact = parseFloat(localStorage.getItem("planImpact")||0);
      });
  </script>

</body>
</html>
