<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>DCA Strategy Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #05060b; --card-bg: rgba(13, 17, 28, 0.7); --accent: #6bb6ff; --green: #4aff8a; --red: #ff5c5c; --border: rgba(255, 255, 255, 0.1); }
    body { background: radial-gradient(circle at top right, #1a1f35, #05060b 60%); color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; }
    .menu { display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 30px; }
    .pill { padding: 10px 22px; border: 1px solid var(--border); border-radius: 12px; color: #94a3b8; text-decoration: none; font-weight: 700; font-size: 13px; background: rgba(255, 255, 255, 0.03); }
    .pill.active { background: var(--accent); color: #000; border-color: #fff; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 30px; max-width: 800px; margin: auto; }
    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
    input { width: 100%; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 10px; color: #fff; font-family: 'JetBrains Mono'; box-sizing: border-box; }
    .note { background: rgba(0,0,0,0.3); border-left: 4px solid var(--accent); padding: 15px; margin: 20px 0; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 20px; }
    td, th { padding: 12px 5px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono'; text-align: left; }
    .red { color: var(--red); } .green { color: var(--green); }
  </style>
</head>
<body>
  <div class="menu">
    <a href="index.html" class="pill">TERMINAL</a>
    <a href="vendita.html" class="pill active">STRATEGY</a>
    <a href="piano.html" class="pill">PLAN</a>
  </div>

  <div class="card">
    <h2 style="margin:0">DCA Exit Simulator</h2>
    <div class="input-grid">
      <div>
        <label style="font-size:10px; font-weight:800; color:#64748b">BUMPER TOTALI</label>
        <input id="total" type="number" oninput="sim()">
      </div>
      <div>
        <label style="font-size:10px; font-weight:800; color:#64748b">NUMERO TRANCHE</label>
        <input id="steps" type="number" oninput="sim()">
      </div>
    </div>

    <div id="res" style="display:none">
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; text-align:center; margin-bottom:20px">
        <div class="card" style="padding:15px">
            <div style="font-size:10px; color:#64748b">PREZZO INIZIALE</div>
            <div id="pStart" style="font-family:'JetBrains Mono'; font-weight:800">--</div>
        </div>
        <div class="card" style="padding:15px">
            <div style="font-size:10px; color:#64748b">PREZZO FINALE</div>
            <div id="pEnd" style="font-family:'JetBrains Mono'; font-weight:800; color:var(--accent)">--</div>
        </div>
      </div>

      <div class="note">
        <b>STRATEGIC NOTE:</b> L'esecuzione di questo piano comporterà una riduzione totale del valore di mercato stimata al <b id="totImpact" class="red">0.00%</b>.
      </div>

      <table>
        <thead><tr><th>STEP</th><th>SIZE</th><th>USDC</th><th>IMPACT</th><th>PREZZO</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    function sim() {
      const tot = parseFloat(document.getElementById("total").value);
      const steps = parseInt(document.getElementById("steps").value);
      const price = parseFloat(localStorage.getItem("globalPrice"));
      const liq = parseFloat(localStorage.getItem("globalLiquidity"));
      
      if(!tot || !steps || !price) return;
      document.getElementById("res").style.display = "block";
      localStorage.setItem("userBumperBalance", tot);

      let curP = price, tbody = document.getElementById("tbody");
      tbody.innerHTML = "";
      document.getElementById("pStart").innerText = "$"+price.toFixed(8);

      for(let i=1; i<=steps; i++) {
        let size = tot/steps;
        let usdc = size * curP;
        let impact = (usdc / (liq/2)) * 100;
        curP = curP * (1 - impact/100);
        tbody.innerHTML += `<tr><td>#${i}</td><td>${Math.floor(size).toLocaleString()}</td><td class="green">$${usdc.toFixed(2)}</td><td class="${impact>0.18?'red':''}">${impact.toFixed(3)}%</td><td>$${curP.toFixed(8)}</td></tr>`;
      }
      document.getElementById("pEnd").innerText = "$"+curP.toFixed(8);
      let totalImp = ((price - curP)/price*100);
      document.getElementById("totImpact").innerText = totalImp.toFixed(2)+"%";
      document.getElementById("totImpact").className = totalImp > 2 ? "red" : "green";
    }
  </script>
</body>
</html>
