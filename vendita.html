<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>BUMPER OS – DCA Strategy Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #05060b; --card-bg: rgba(13, 17, 28, 0.8); --accent: #6bb6ff; --green: #4aff8a; --red: #ff5c5c; --border: rgba(255, 255, 255, 0.08); }
    body { background: radial-gradient(circle at top right, #1a1f35, #05060b 60%); color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 20px; line-height: 1.6; }
    
    .menu { display: flex; justify-content: flex-end; gap: 12px; padding-bottom: 30px; }
    .pill { padding: 10px 22px; border: 1px solid var(--border); border-radius: 12px; color: #94a3b8; text-decoration: none; font-weight: 700; font-size: 13px; transition: 0.3s; background: rgba(255, 255, 255, 0.03); }
    .pill:hover { border-color: var(--accent); color: #fff; }
    .pill.active { background: var(--accent); color: #000; border-color: #fff; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; padding: 32px; max-width: 900px; margin: 0 auto; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
    
    .market-context { display: flex; gap: 20px; margin-bottom: 30px; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 16px; border: 1px dashed var(--border); }
    .context-item { flex: 1; }
    .context-label { font-size: 9px; text-transform: uppercase; color: #64748b; font-weight: 800; letter-spacing: 1px; }
    .context-value { font-family: 'JetBrains Mono'; font-size: 14px; color: var(--accent); }

    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .input-field { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
    label { font-size: 11px; color: #94a3b8; font-weight: 700; display: block; margin-bottom: 8px; }
    input { width: 100%; background: transparent; border: none; color: #fff; font-family: 'JetBrains Mono'; font-size: 18px; outline: none; }

    .status-tag { padding: 6px 14px; border-radius: 100px; font-size: 11px; font-weight: 900; text-transform: uppercase; }
    .tag-safe { background: rgba(74, 255, 138, 0.1); color: var(--green); border: 1px solid rgba(74, 255, 138, 0.3); }
    .tag-risk { background: rgba(255, 92, 92, 0.1); color: var(--red); border: 1px solid rgba(255, 92, 92, 0.3); }

    .summary-box { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 30px; border: 1px solid var(--border); }
    .summary-item { background: var(--card-bg); padding: 20px; text-align: center; }
    .summary-label { font-size: 10px; color: #64748b; font-weight: 800; margin-bottom: 5px; }
    .summary-value { font-family: 'JetBrains Mono'; font-size: 22px; font-weight: 800; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; font-size: 10px; color: #64748b; padding: 12px; text-transform: uppercase; letter-spacing: 1px; }
    td { padding: 14px 12px; border-bottom: 1px solid rgba(255,255,255,0.03); font-family: 'JetBrains Mono'; font-size: 13px; }
    tr:hover td { background: rgba(255,255,255,0.01); }
    
    .green { color: var(--green); } .red { color: var(--red); }
    .dim { color: #64748b; }
  </style>
</head>
<body>

  <nav class="menu">
    <a href="index.html" class="pill">TERMINAL</a>
    <a href="vendita.html" class="pill active">STRATEGY</a>
    <a href="piano.html" class="pill">PLAN</a>
  </nav>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:30px">
      <div>
        <h1 style="margin:0; font-size:24px; font-weight:900; letter-spacing:-0.5px">DCA Exit Simulator</h1>
        <p style="margin:5px 0 0; color:#64748b; font-size:13px">Ottimizza la liquidazione riducendo il Price Impact</p>
      </div>
      <div id="strategyRating" class="status-tag" style="background:rgba(255,255,255,0.05); color:#64748b">In attesa dati</div>
    </div>

    <div class="market-context">
      <div class="context-item">
        <div class="context-label">Prezzo Attuale</div>
        <div id="ctxPrice" class="context-value">$0.00</div>
      </div>
      <div class="context-item">
        <div class="context-label">Liquidità Totale</div>
        <div id="ctxLiq" class="context-value">$0.00</div>
      </div>
    </div>

    <div class="input-grid">
      <div class="input-field">
        <label for="totalToSell">Token da Vendere</label>
        <input id="totalToSell" type="number" placeholder="0.00" oninput="runSim()">
      </div>
      <div class="input-field">
        <label for="numTranches">Numero Step (Tranche)</label>
        <input id="numTranches" type="number" placeholder="10" oninput="runSim()">
      </div>
    </div>

    <div id="simulationResult" style="display:none">
      <div class="summary-box">
        <div class="summary-item">
          <div class="summary-label">IMPATTO TOTALE</div>
          <div id="totalImpact" class="summary-value">0.00%</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">PREZZO FINALE STIMATO</div>
          <div id="endPrice" class="summary-value">$0.00</div>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Step</th>
            <th>Quantità BP</th>
            <th>Impatto</th>
            <th>Prezzo Post-Vendita</th>
          </tr>
        </thead>
        <tbody id="dcaBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    function runSim() {
      const total = parseFloat(document.getElementById("totalToSell").value);
      const tranches = parseInt(document.getElementById("numTranches").value);
      
      const price = parseFloat(localStorage.getItem("globalPrice") || 0);
      const liq = parseFloat(localStorage.getItem("globalLiquidity") || 0);

      // Aggiorna widget contestuale
      document.getElementById("ctxPrice").textContent = price > 0 ? "$" + price.toFixed(8) : "---";
      document.getElementById("ctxLiq").textContent = liq > 0 ? "$" + liq.toLocaleString() : "---";

      if (total > 0 && tranches > 0 && price > 0 && liq > 0) {
        document.getElementById("simulationResult").style.display = "block";
        
        const tbody = document.getElementById("dcaBody");
        tbody.innerHTML = "";
        
        let currentPrice = price;
        const sizePerStep = total / tranches;
        const liqPoolSide = liq / 2; // Stima lato USDC/SOL

        // Calcolo impatto per rating
        const initialImpact = ((sizePerStep * price) / liqPoolSide) * 100;
        const rating = document.getElementById("strategyRating");
        
        if(initialImpact > 0.20) {
          rating.textContent = "Rischio Elevato";
          rating.className = "status-tag tag-risk";
        } else {
          rating.textContent = "Esecuzione Sicura";
          rating.className = "status-tag tag-safe";
        }

        for (let i = 1; i <= tranches; i++) {
          let stepValueUsd = sizePerStep * currentPrice;
          let stepImpact = (stepValueUsd / liqPoolSide) * 100;
          let oldPrice = currentPrice;
          currentPrice = currentPrice * (1 - stepImpact / 100);
          
          const row = `
            <tr>
              <td class="dim">#${i.toString().padStart(2, '0')}</td>
              <td style="font-weight:700">${Math.floor(sizePerStep).toLocaleString()}</td>
              <td class="${stepImpact > 0.15 ? 'red' : 'green'}">-${stepImpact.toFixed(3)}%</td>
              <td>$${currentPrice.toFixed(8)}</td>
            </tr>`;
          tbody.insertAdjacentHTML('beforeend', row);
        }

        const totalImpactPerc = ((price - currentPrice) / price) * 100;
        document.getElementById("totalImpact").textContent = totalImpactPerc.toFixed(2) + "%";
        document.getElementById("totalImpact").className = "summary-value " + (totalImpactPerc > 5 ? "red" : "green");
        document.getElementById("endPrice").textContent = "$" + currentPrice.toFixed(8);
      }
    }

    // Auto-aggiornamento se cambiano i dati nel terminale
    window.addEventListener('storage', runSim);
    window.onload = runSim;
  </script>
</body>
</html>
