<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>BUMPER OS – DCA Strategy Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #05060b; --card-bg: rgba(13, 17, 28, 0.7); --accent: #6bb6ff; --green: #4aff8a; --red: #ff5c5c; --border: rgba(255, 255, 255, 0.08); }
    body { background: radial-gradient(circle at top right, #1a1f35, #05060b 60%); color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 20px; }
    
    .menu { display: flex; justify-content: flex-end; gap: 12px; padding: 15px 0; }
    .pill { padding: 10px 22px; border: 1px solid var(--border); border-radius: 12px; color: #94a3b8; text-decoration: none; font-weight: 700; font-size: 13px; transition: 0.3s; }
    .pill.active { background: var(--accent); color: #000; border-color: #fff; }
    
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 30px; max-width: 700px; margin: 20px auto; backdrop-filter: blur(10px); }
    
    .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    label { font-size: 11px; color: #64748b; font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 8px; }
    input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: #fff; font-family: 'JetBrains Mono'; box-sizing: border-box; outline: none; transition: 0.3s; }
    input:focus { border-color: var(--accent); }

    .summary-card { background: rgba(255,255,255,0.03); border-radius: 15px; padding: 20px; border-left: 4px solid var(--accent); margin-bottom: 20px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th { text-align: left; color: #64748b; padding-bottom: 10px; font-size: 11px; }
    td { padding: 12px 0; border-top: 1px solid var(--border); font-family: 'JetBrains Mono'; }
    
    .status-tag { padding: 4px 8px; border-radius: 5px; font-size: 10px; font-weight: 800; }
    .tag-safe { background: rgba(74, 255, 138, 0.1); color: var(--green); }
    .tag-risk { background: rgba(255, 92, 92, 0.1); color: var(--red); }
  </style>
</head>
<body>

  <div class="menu">
    <a href="index.html" class="pill">TERMINAL</a>
    <a href="vendita.html" class="pill active">STRATEGY</a>
    <a href="piano.html" class="pill">PLAN</a>
  </div>

  <div class="card">
    <h2 style="margin: 0 0 25px 0; font-weight: 900;">DCA Exit Simulator</h2>

    <div class="input-group">
      <div>
        <label>Totale BUMPER da vendere</label>
        <input id="totalToSell" type="number" placeholder="Es. 1000000" oninput="runSimulation()">
      </div>
      <div>
        <label>Numero Operazioni (Tranche)</label>
        <input id="numTranches" type="number" placeholder="Es. 5" oninput="runSimulation()">
      </div>
    </div>

    <div id="simulationResult" style="display:none">
      <div class="summary-card">
        <div style="display:flex; justify-content:space-between; align-items:center">
          <div>
            <span style="font-size:12px; color:#64748b">Impatto per singola operazione</span>
            <div id="singleImpact" style="font-size:24px; font-weight:800">0%</div>
          </div>
          <div style="text-align:right">
            <span id="strategyRating" class="status-tag tag-safe">STRATEGIA SICURA</span>
          </div>
        </div>
      </div>

      <label>Proiezione DCA Step-by-Step</label>
      <table id="dcaTable">
        <thead>
          <tr>
            <th>STEP</th>
            <th>SIZE (BP)</th>
            <th>USDC RICEVUTI</th>
            <th>NUOVO PREZZO</th>
            <th>IMPATTO</th>
          </tr>
        </thead>
        <tbody>
          </tbody>
      </table>
      <div style="margin-top:20px; font-size:12px; color:#64748b; text-align:center">
        L'impatto totale cumulativo stimato è del <b id="totalImpact" class="red">--</b>
      </div>
    </div>
  </div>

  <script>
    function runSimulation() {
      const total = parseFloat(document.getElementById("totalToSell").value || 0);
      const tranches = parseInt(document.getElementById("numTranches").value || 0);
      const price = parseFloat(localStorage.getItem("globalPrice") || 0);
      const liq = parseFloat(localStorage.getItem("globalLiquidity") || 0);
      
      const resDiv = document.getElementById("simulationResult");
      const tbody = document.querySelector("#dcaTable tbody");

      if (total > 0 && tranches > 0 && price > 0) {
        resDiv.style.display = "block";
        tbody.innerHTML = "";
        
        let currentPrice = price;
        const sizePerTranche = total / tranches;
        const singleUsdValue = sizePerTranche * price;
        const singleImpact = (singleUsdValue / (liq / 2)) * 100;
        
        // UI Header Update
        document.getElementById("singleImpact").textContent = singleImpact.toFixed(3) + "%";
        const rating = document.getElementById("strategyRating");
        if(singleImpact > 0.25) {
          rating.textContent = "STRATEGIA RISCHIOSA";
          rating.className = "status-tag tag-risk";
          document.getElementById("singleImpact").className = "red";
        } else {
          rating.textContent = "STRATEGIA SICURA";
          rating.className = "status-tag tag-safe";
          document.getElementById("singleImpact").className = "green";
        }

        // Generazione Tabella
        for (let i = 1; i <= tranches; i++) {
          let stepUsdc = sizePerTranche * currentPrice;
          let stepImpact = (stepUsdc / (liq / 2)) * 100;
          currentPrice = currentPrice * (1 - stepImpact / 100);

          const row = `<tr>
            <td>#${i}</td>
            <td>${Math.floor(sizePerTranche).toLocaleString()}</td>
            <td class="green">$${stepUsdc.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
            <td>$${currentPrice.toFixed(8)}</td>
            <td class="${stepImpact > 0.25 ? 'red' : ''}">${stepImpact.toFixed(3)}%</td>
          </tr>`;
          tbody.innerHTML += row;
        }
        
        const totalCumulImpact = ((price - currentPrice) / price * 100);
        document.getElementById("totalImpact").textContent = totalCumulImpact.toFixed(2) + "%";
        
      } else {
        resDiv.style.display = "none";
      }
    }

    // Sincronizzazione con Dashboard
    setInterval(() => {
        if(document.getElementById("totalToSell").value) runSimulation();
    }, 5000);
  </script>
</body>
</html>
