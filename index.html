<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>BUMPER Dashboard</title>
<style>
    body { background:#0d0d0d; color:#fff; font-family:Arial; padding:20px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; }
    .card { background:#1a1a1a; padding:15px; border-radius:10px; }
    h1 { display:flex; align-items:center; gap:10px; }
    #logo { width:50px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    td,th { padding:8px; border-bottom:1px solid #333; }
</style>
</head>
<body>

<h1>
    <img id="logo" src="https://cryptologos.cc/logos/bumper-bump-logo.png">
    BUMPER Dashboard
</h1>

<div class="grid">
    <div class="card"><h2>Prezzo</h2><div id="price">Loading...</div></div>
    <div class="card"><h2>Market Cap</h2><div id="marketcap">Loading...</div></div>
    <div class="card"><h2>Holders</h2><div id="holders">Loading...</div></div>
    <div class="card"><h2>Volume 24h</h2><div id="volume">Loading...</div></div>
</div>

<div class="card">
    <h2>Coppie DEX</h2>
    <table id="pairs"></table>
</div>

<script>
const TOKEN = "5SpYsFyuJ41h1Qy9eRufyqR12CmyXet2pG3EXEbok";
const BIRDEYE = "INSERISCI_API_KEY";
const BIRDEYE_URL = "https://public-api.birdeye.so";
const DS_URL = "https://api.dexscreener.com/latest/dex/tokens/" + TOKEN;

// -----------------------------
// FETCH BIRDEYE
// -----------------------------
async function fetchBirdeye() {
    const headers = { "X-API-KEY": BIRDEYE, "accept": "application/json" };

    try {
        const [priceRes, overviewRes] = await Promise.all([
            fetch(`${BIRDEYE_URL}/defi/price?address=${TOKEN}`, { headers }),
            fetch(`${BIRDEYE_URL}/defi/token_overview?address=${TOKEN}`, { headers })
        ]);

        const priceData = await priceRes.json();
        const overview = await overviewRes.json();

        document.getElementById("price").textContent =
            priceData.data?.value ? "$" + priceData.data.value.toFixed(8) : "N/A";

        document.getElementById("marketcap").textContent =
            overview.data?.mc ? "$" + overview.data.mc.toLocaleString() : "N/A";

        document.getElementById("holders").textContent =
            overview.data?.holders || "N/A";

        document.getElementById("volume").textContent =
            overview.data?.v24h ? "$" + overview.data.v24h.toLocaleString() : "N/A";

    } catch (e) {
        console.error("Errore Birdeye:", e);
    }
}

// -----------------------------
// FETCH DEXSCREENER (FALLBACK)
// -----------------------------
async function fetchDex() {
    try {
        const res = await fetch(DS_URL);
        const data = await res.json();

        const table = document.getElementById("pairs");
        table.innerHTML = "<tr><th>DEX</th><th>Prezzo</th><th>24h</th><th>Volume</th><th>Liquidity</th></tr>";

        data.pairs?.forEach(p => {
            table.innerHTML += `
                <tr>
                    <td>${p.dexId}</td>
                    <td>$${p.priceUsd || "0.00"}</td>
                    <td>${p.priceChange?.h24 || 0}%</td>
                    <td>$${p.volume?.h24 || 0}</td>
                    <td>$${p.liquidity?.usd || 0}</td>
                </tr>
            `;
        });

    } catch (e) {
        console.error("Errore Dexscreener:", e);
    }
}

// -----------------------------
// REFRESH
// -----------------------------
function refresh() {
    fetchBirdeye();
    fetchDex();
}

refresh();
setInterval(refresh, 15000);
</script>

</body>
</html>
