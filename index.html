<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>BUMPER Dashboard</title>

  <style>
    body {
      background:#0b0d10;
      color:#e6e6e6;
      font-family:Arial;
      padding:25px;
      margin:0;
    }

    /* MENU IN ALTO A DESTRA */
    .menu {
      position:absolute;
      top:20px;
      right:30px;
      display:flex;
      gap:12px;
    }

    .pill {
      padding:8px 16px;
      border:2px solid #9ecbff;
      border-radius:20px;
      color:#9ecbff;
      text-decoration:none;
      font-weight:bold;
      transition:0.2s;
    }

    .pill:hover {
      background:#9ecbff22;
      color:white;
      border-color:white;
    }

    /* PULSANTE ATTIVO */
    .active {
      border-color:white !important;
      color:white !important;
      background:#9ecbff22;
      cursor:default;
    }

    /* HEADER */
    h1 {
      display:flex;
      align-items:center;
      gap:15px;
      font-size:28px;
      font-weight:bold;
    }

    #logo {
      width:70px;
      height:70px;
      border-radius:10px;
      background:#111;
    }

    /* CARD */
    .card {
      background:#161a20;
      padding:20px;
      border-radius:12px;
      margin-bottom:20px;
      border:1px solid #222;
    }

    .value {
      font-size:28px;
      font-weight:bold;
    }

    .green { color:#00cc33; font-weight:bold; }
    .red { color:#ff3333; font-weight:bold; }
    .yellow { color:#ffd700; font-weight:bold; }

    /* TITOLI INTERNI CON LINEA SPESSA */
    .section-title {
      text-align:center;
      font-weight:900;
      font-size:20px;
      margin:14px 0 10px 0;
    }

    .section-title::before,
    .section-title::after {
      content:"";
      display:inline-block;
      width:28%;
      border-top:3px solid #cccccc;
      margin:0 10px;
      transform:translateY(-4px);
    }

    /* SPARKLINE */
    .sparkline {
      width:120px;
      height:30px;
      background:#111;
      border-radius:6px;
      margin-top:8px;
    }

    /* TABELLA DEX */
    table {
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      font-size:16px;
    }

    th, td {
      padding:10px;
      border-bottom:1px solid #333;
    }

    th {
      background:#1e222a;
      color:#9ecbff;
      font-size:15px;
    }

    tr:nth-child(odd) { background:#1a1d23; }
    tr:nth-child(even) { background:#22262d; }

    .semaforo-dot {
      width:14px;
      height:14px;
      border-radius:50%;
      display:inline-block;
      margin-right:6px;
    }
  </style>
</head>

<body>

  <!-- MENU -->
  <div class="menu">
    <a href="index.html" class="pill active">Dashboard</a>
    <a href="vendita.html" class="pill">Vendita</a>
  </div>

  <!-- HEADER -->
  <h1>
    <img id="logo" src="logo.png">
    <span>BUMPER Dashboard</span>
  </h1>

  <!-- PIANO DI VENDITA -->
  <div style="background:#dddddd;padding:20px;border-radius:12px;margin-bottom:25px;display:flex;justify-content:space-between;flex-wrap:wrap">
    <div>
      <div style="font-size:22px;font-weight:900;color:#ff3333">Piano di vendita (basso impatto)</div>
      <div id="safeSellTop" style="font-size:34px;font-weight:900;color:#00cc33;margin-top:8px">–</div>
      <div style="font-size:20px;font-weight:900;color:#00cc33">BUMPER totali</div>
      <div id="riskLabel" style="margin-top:12px;font-size:16px;font-weight:900;color:#333">
        <span id="riskDot" class="semaforo-dot" style="background:#999"></span>Rischio: –
      </div>
    </div>

    <div style="text-align:right">
      <div style="font-size:20px;font-weight:900;color:#222">Equivalente: <span id="safeSellUSDC" style="color:#00cc33">–</span> USDC</div>
      <div style="font-size:18px;margin-top:10px;color:#444;font-weight:900">DCA: <span id="dcaCount">–</span> × <span id="dcaTranche">–</span></div>
      <div style="font-size:16px;margin-top:10px;color:#555;font-weight:900">Impatto per tranche: <span id="impactPerTranche">–</span></div>
      <div style="font-size:13px;margin-top:10px;color:#333">Prezzo dopo tranche: <span id="estimatedPrice">–</span></div>
    </div>
  </div>

  <!-- CARDS DATI -->
  <div class="card" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px">
    <div>
      <h2>Prezzo</h2>
      <div id="price" class="value">–</div>
      <div id="priceChange" class="yellow">–</div>
    </div>
    <div>
      <h2>Volume 24h</h2>
      <div id="volume24" class="value">–</div>
    </div>
    <div>
      <h2>Liquidità</h2>
      <div id="liquidity" class="value">–</div>
    </div>
    <div>
      <h2>FDV</h2>
      <div id="fdv" class="value">–</div>
    </div>
  </div>

  <!-- MEGA-CARD BUY/SELL + VOLUMI -->
  <div class="card">

    <div class="section-title">BUY/SELL</div>

    <div id="bs24" style="margin-top:6px;font-size:18px"></div>
    <div id="bs6"  style="margin-top:6px;font-size:18px"></div>
    <div id="bs1"  style="margin-top:6px;font-size:18px"></div>

    <div id="sentiment" style="margin-top:12px;font-size:20px;font-weight:bold"></div>

    <div style="margin-top:16px">
      <div style="color:#00cc33;font-weight:bold">BUY</div>
      <div id="barBuy" style="height:10px;background:#00cc33;width:0%;border-radius:4px"></div>

      <div style="color:#ff3333;font-weight:bold;margin-top:12px">SELL</div>
      <div id="barSell" style="height:10px;background:#ff3333;width:0%;border-radius:4px"></div>
    </div>

    <canvas id="sparkBS" class="sparkline" style="margin-top:16px"></canvas>

    <div class="section-title" style="margin-top:24px">VOLUMI</div>

    <div id="vol1"  style="margin-top:6px;font-size:18px"></div>
    <div id="vol6"  style="margin-top:6px;font-size:18px"></div>
    <div id="vol24" style="margin-top:6px;font-size:18px"></div>
    <div id="vol48" style="margin-top:6px;font-size:18px"></div>
    <div id="vol72" style="margin-top:6px;font-size:18px"></div>

  </div>

  <!-- TABELLA DEX -->
  <div class="card">
    <h2>Coppie DEX</h2>
    <table id="pairs">
      <tr><th>DEX</th><th>Coppia</th><th>Prezzo</th><th>24h%</th><th>Volume</th><th>Liquidity</th></tr>
    </table>
  </div>

  <!-- SCRIPT (identico a prima, senza la parte Vendita Personalizzata) -->
  <script>
    /* Tutto il tuo JS rimane identico, tranne la parte della vendita personalizzata che ora è in vendita.html */
    /* ... (JS completo qui, identico alla tua versione attuale) ... */
  </script>

</body>
</html>
