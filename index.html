<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUMPER Terminal – Dashboard Completa</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg: #05060b; --card-bg: rgba(13, 17, 28, 0.7); --accent: #6bb6ff; --green: #4aff8a; --red: #ff5c5c; --border: rgba(255, 255, 255, 0.08); }
    body { background: radial-gradient(circle at top right, #1a1f35, #05060b 60%); color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 20px; }
    
    .menu { display: flex; justify-content: flex-end; gap: 12px; padding: 15px 0; }
    .pill { padding: 10px 22px; border: 1px solid var(--border); border-radius: 12px; color: #94a3b8; text-decoration: none; font-weight: 700; font-size: 13px; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); transition: 0.3s; }
    .pill.active { background: var(--accent); color: #000; border-color: #fff; }
    
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 10px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 25px; backdrop-filter: blur(10px); position: relative; overflow: hidden; }
    
    .label { font-size: 10px; color: #64748b; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
    .value { font-family: 'JetBrains Mono'; font-size: 26px; font-weight: 800; color: #fff; }
    
    .vol-box { display: flex; justify-content: space-between; margin-top: 15px; font-family: 'JetBrains Mono'; font-size: 12px; }
    .sentiment-badge { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 900; }
    
    .chart-container { position: relative; width: 80px; height: 80px; }
    .green { color: var(--green); } .red { color: var(--red); }
    
    .footer-stats { grid-column: span 3; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
    .mini-card { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; border: 1px solid var(--border); }
  </style>
</head>
<body>

  <div class="menu">
    <a href="index.html" class="pill active">TERMINAL</a>
    <a href="vendita.html" class="pill">STRATEGY</a>
    <a href="piano.html" class="pill">PLAN</a>
  </div>

  <div style="margin-bottom: 30px;">
    <h1 style="font-weight: 900; letter-spacing: -1.5px; margin: 0;">BUMPER <span style="color: var(--accent);">OS</span></h1>
    <div style="font-size: 12px; color: #64748b; font-weight: 700;">REAL-TIME MARKET INTELLIGENCE</div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="label">Price Action (24h)</div>
      <div id="price" class="value">$0.00000000</div>
      <div id="priceChange" style="font-weight: 800; margin-top: 5px;">0.00%</div>
    </div>

    <div class="card">
      <div class="label">Market Liquidity</div>
      <div id="liquidity" class="value">$0</div>
      <div id="fdv" style="font-size: 12px; color: #64748b; font-weight: 700; margin-top: 5px;">FDV: $0</div>
    </div>

    <div class="card" style="display: flex; align-items: center; justify-content: space-between;">
      <div>
        <div class="label">Sentiment</div>
        <div id="sentLabel" class="sentiment-badge">SCANNING...</div>
        <div id="txCount" style="font-family: 'JetBrains Mono'; font-size: 10px; color: #64748b; margin-top: 8px;">TX: 0 BUY / 0 SELL</div>
      </div>
      <div class="chart-container">
        <canvas id="sentChart"></canvas>
      </div>
    </div>

    <div class="card" style="grid-column: span 3;">
      <div class="label">Volume Breakdown (24h)</div>
      <div class="vol-box">
        <div>
          <span style="color: #64748b;">BUY VOLUME</span>
          <div id="buyVol" class="green" style="font-size: 18px; font-weight: 800;">$0</div>
        </div>
        <div style="text-align: center;">
          <span style="color: #64748b;">TOTAL VOLUME</span>
          <div id="totalVol" style="font-size: 18px; font-weight: 800;">$0</div>
        </div>
        <div style="text-align: right;">
          <span style="color: #64748b;">SELL VOLUME</span>
          <div id="sellVol" class="red" style="font-size: 18px; font-weight: 800;">$0</div>
        </div>
      </div>
      <div style="height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; margin-top: 15px; overflow: hidden; display: flex;">
        <div id="buyBar" style="height: 100%; background: var(--green); width: 50%;"></div>
        <div id="sellBar" style="height: 100%; background: var(--red); width: 50%;"></div>
      </div>
    </div>
  </div>

  <div class="footer-stats">
    <div class="mini-card">
        <div class="label" style="margin:0">M5 Change</div>
        <div id="m5" class="value" style="font-size:16px; margin:5px 0">0%</div>
    </div>
    <div class="mini-card">
        <div class="label" style="margin:0">H1 Change</div>
        <div id="h1" class="value" style="font-size:16px; margin:5px 0">0%</div>
    </div>
    <div class="mini-card">
        <div class="label" style="margin:0">H6 Change</div>
        <div id="h6" class="value" style="font-size:16px; margin:5px 0">0%</div>
    </div>
    <div class="mini-card">
        <div class="label" style="margin:0">Launch Date</div>
        <div class="value" style="font-size:16px; margin:5px 0; color: var(--accent);">JAN 2026</div>
    </div>
  </div>

  <script>
    const TOKEN_ADDR = "5bp5PwTyu4i1hGyQsRwRYqiR2CmxyHt2cPJGEbXEbonk";
    let sentChart;

    async function fetchData() {
      try {
        const response = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${TOKEN_ADDR}`);
        const data = await response.json();
        const pair = data.pairs[0];
        
        // Calcolo Liquidità Totale (somma di tutte le pool)
        const totalLiq = data.pairs.reduce((sum, p) => sum + (p.liquidity ? p.liquidity.usd : 0), 0);
        
        // Salvataggio per le altre pagine
        localStorage.setItem("globalPrice", pair.priceUsd);
        localStorage.setItem("globalLiquidity", totalLiq);

        // Update UI Prezzo
        document.getElementById("price").innerText = "$" + parseFloat(pair.priceUsd).toFixed(8);
        const change = pair.priceChange.h24;
        document.getElementById("priceChange").innerText = (change > 0 ? "+" : "") + change + "%";
        document.getElementById("priceChange").className = change >= 0 ? "green" : "red";

        // Update UI Liquidità
        document.getElementById("liquidity").innerText = "$" + Math.floor(totalLiq).toLocaleString();
        document.getElementById("fdv").innerText = "FDV: $" + Math.floor(pair.fdv).toLocaleString();

        // Update Volumi
        const v = pair.volume.h24;
        const buys = pair.txns.h24.buys;
        const sells = pair.txns.h24.sells;
        const buyRatio = buys / (buys + sells);
        
        document.getElementById("totalVol").innerText = "$" + Math.floor(v).toLocaleString();
        document.getElementById("buyVol").innerText = "$" + Math.floor(v * buyRatio).toLocaleString();
        document.getElementById("sellVol").innerText = "$" + Math.floor(v * (1 - buyRatio)).toLocaleString();
        document.getElementById("buyBar").style.width = (buyRatio * 100) + "%";
        document.getElementById("sellBar").style.width = ((1 - buyRatio) * 100) + "%";

        // Sentiment Chart & Label
        document.getElementById("txCount").innerText = `TX: ${buys} BUY / ${sells} SELL`;
        const sLabel = document.getElementById("sentLabel");
        if(buyRatio > 0.52) { sLabel.innerText = "BULLISH"; sLabel.style.background = "rgba(74,255,138,0.1)"; sLabel.className = "sentiment-badge green"; }
        else if(buyRatio < 0.48) { sLabel.innerText = "BEARISH"; sLabel.style.background = "rgba(255,92,92,0.1)"; sLabel.className = "sentiment-badge red"; }
        else { sLabel.innerText = "NEUTRAL"; sLabel.style.background = "rgba(255,255,255,0.05)"; sLabel.className = "sentiment-badge"; }

        // Mini Stats
        const updateMini = (id, val) => {
            document.getElementById(id).innerText = (val > 0 ? "+" : "") + val + "%";
            document.getElementById(id).className = "value " + (val >= 0 ? "green" : "red");
        };
        updateMini("m5", pair.priceChange.m5);
        updateMini("h1", pair.priceChange.h1);
        updateMini("h6", pair.priceChange.h6);

        // Chart.js Update
        if (sentChart) sentChart.destroy();
        const ctx = document.getElementById('sentChart').getContext('2d');
        sentChart = new Chart(ctx, {
          type: 'doughnut',
          data: {
            datasets: [{
              data: [buys, sells],
              backgroundColor: ['#4aff8a', '#ff5c5c'],
              borderWidth: 0,
              hoverOffset: 0
            }]
          },
          options: { cutout: '75%', plugins: { legend: { display: false }, tooltip: { enabled: false } } }
        });

      } catch (e) { console.error("Errore API:", e); }
    }

    fetchData();
    setInterval(fetchData, 10000);
  </script>
</body>
</html>
