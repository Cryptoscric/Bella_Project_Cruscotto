<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>BUMPER Fiodena Team Dashboard</title>

<style>
    body {
        background:#0d0f12;
        color:#ffffff;
        font-family:Arial, sans-serif;
        margin:0;
        padding:20px;
    }
    h1 {
        display:flex;
        align-items:center;
        gap:12px;
        margin-bottom:20px;
    }
    #logo {
        width:60px;
        height:60px;
        border-radius:8px;
        object-fit:contain;
        background:#111;
    }
    .grid {
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
        gap:15px;
        margin-bottom:20px;
    }
    .card {
        background:#161a20;
        padding:15px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.4);
    }
    .card h2 {
        margin:0 0 10px 0;
        font-size:16px;
    }
    .value {
        font-size:22px;
        font-weight:bold;
    }
    table {
        width:100%;
        border-collapse:collapse;
        margin-top:10px;
        font-size:14px;
    }
    th, td {
        padding:6px 8px;
        border-bottom:1px solid #333;
    }
    th {
        background:#1e222a;
    }
    .status-ok { color:#00ff99; }
    .status-err { color:#ff4d4d; }
</style>

</head>
<body>

<h1>
    <img id="logo" src="logo.png" alt="logo">
    <span>BUMPER Dashboard</span>
</h1>

<div id="status" class="status-err">Caricamento...</div>

<div class="grid">
    <div class="card">
        <h2>Prezzo</h2>
        <div id="price" class="value">–</div>
        <div id="price-change"></div>
    </div>

    <div class="card">
        <h2>Volume 24h</h2>
        <div id="volume24" class="value">–</div>
    </div>

    <div class="card">
        <h2>Liquidità</h2>
        <div id="liquidity" class="value">–</div>
    </div>

    <div class="card">
        <h2>FDV</h2>
        <div id="fdv" class="value">–</div>
    </div>

    <div class="card">
        <h2>BUY / SELL 24h</h2>
        <div class="value">
            <span id="buys24">–</span> /
            <span id="sells24">–</span>
        </div>
    </div>
</div>

<div class="card">
    <h2>Coppie DEX (Dexscreener)</h2>
    <table id="pairs">
        <tr>
            <th>DEX</th>
            <th>Coppia</th>
            <th>Prezzo</th>
            <th>24h %</th>
            <th>Volume 24h</th>
            <th>Liquidity</th>
        </tr>
    </table>
</div>

<!-- Carica config.js PRIMA del codice -->
<script src="config.js"></script>

<script>
// =========================
// Controllo caricamento config.js
// =========================
if (typeof HELIUS_API_KEY === "undefined") {
    document.getElementById("status").textContent =
        "ERRORE: config.js NON caricato o variabile HELIUS_API_KEY mancante";
    document.getElementById("status").className = "status-err";
} else {
    document.getElementById("status").textContent =
        "config.js caricato correttamente";
    document.getElementById("status").className = "status-ok";
}

// =========================
// Dexscreener (pubblico)
// =========================
const TOKEN_MINT = "5bp5PwTyu4i1hGyQsRwRYqiR2CmxyHt2cPJGEbXEbonk";
const DS_URL = "https://api.dexscreener.com/latest/dex/tokens/" + TOKEN_MINT;

function fmtUsd(v) {
    if (!v) return "–";
    const n = Number(v);
    if (n < 1) return "$" + n.toFixed(6);
    return "$" + n.toLocaleString();
}

async function loadDexscreener() {
    try {
        const res = await fetch(DS_URL);
        const data = await res.json();

        if (!data.pairs || data.pairs.length === 0) {
            document.getElementById("status").textContent =
                "Nessuna coppia trovata su Dexscreener";
            document.getElementById("status").className = "status-err";
            return;
        }

        const p = data.pairs[0];

        document.getElementById("price").textContent =
            p.priceUsd ? "$" + Number(p.priceUsd).toFixed(8) : "–";

        document.getElementById("price-change").textContent =
            p.priceChange?.h24 !== undefined ? `24h: ${p.priceChange.h24}%` : "";

        document.getElementById("volume24").textContent = fmtUsd(p.volume?.h24);
        document.getElementById("liquidity").textContent = fmtUsd(p.liquidity?.usd);
        document.getElementById("fdv").textContent = fmtUsd(p.fdv);

        document.getElementById("buys24").textContent = p.txns?.h24?.buys ?? "–";
        document.getElementById("sells24").textContent = p.txns?.h24?.sells ?? "–";

        // Tabella coppie
        const table = document.getElementById("pairs");
        table.innerHTML = `
            <tr>
                <th>DEX</th>
                <th>Coppia</th>
                <th>Prezzo</th>
                <th>24h %</th>
                <th>Volume 24h</th>
                <th>Liquidity</th>
            </tr>
        `;

        data.pairs.forEach(pair => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${pair.dexId}</td>
                <td>${pair.baseToken?.symbol}/${pair.quoteToken?.symbol}</td>
                <td>${pair.priceUsd ? "$" + Number(pair.priceUsd).toFixed(8) : "–"}</td>
                <td>${pair.priceChange?.h24 ?? "–"}%</td>
                <td>${fmtUsd(pair.volume?.h24)}</td>
                <td>${fmtUsd(pair.liquidity?.usd)}</td>
            `;
            table.appendChild(tr);
        });

        document.getElementById("status").textContent = "Dati caricati";
        document.getElementById("status").className = "status-ok";

    } catch (err) {
        console.error(err);
        document.getElementById("status").textContent =
            "Errore nel caricamento Dexscreener";
        document.getElementById("status").className = "status-err";
    }
}

loadDexscreener();
setInterval(loadDexscreener, 15000);
</script>

</body>
</html>
