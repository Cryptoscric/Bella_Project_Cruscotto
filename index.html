<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>BUMPER Fiodena Team Dashboard</title>

<style>
    body {
        background:#0d0f12;
        color:#ffffff;
        font-family:Arial, sans-serif;
        margin:0;
        padding:20px;
    }
    h1 {
        display:flex;
        align-items:center;
        gap:12px;
        margin-bottom:20px;
    }
    #logo {
        width:60px;
        height:60px;
        border-radius:8px;
        object-fit:contain;
        background:#111;
    }
    .grid {
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
        gap:15px;
        margin-bottom:20px;
    }
    .card {
        background:#161a20;
        padding:15px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.4);
    }
    .card h2 {
        margin:0 0 10px 0;
        font-size:16px;
    }
    .value {
        font-size:22px;
        font-weight:bold;
    }
    table {
        width:100%;
        border-collapse:collapse;
        margin-top:10px;
        font-size:14px;
    }
    th, td {
        padding:6px 8px;
        border-bottom:1px solid #333;
    }
    th {
        background:#1e222a;
    }
    .status-ok { color:#00ff99; }
    .status-err { color:#ff4d4d; }
</style>
</head>
<body>

<h1>
    <img id="logo" src="logo.png" alt="logo">
    <span>BUMPER Fiodena Team Dashboard</span>
</h1>

<div id="status" class="status-err">Caricamento...</div>

<div class="grid">
    <div class="card">
        <h2>Prezzo</h2>
        <div id="price" class="value">–</div>
        <div id="price-change"></div>
    </div>

    <div class="card">
        <h2>Volume 24h</h2>
        <div id="volume24" class="value">–</div>
    </div>

    <div class="card">
        <h2>Liquidità</h2>
        <div id="liquidity" class="value">–</div>
    </div>

    <div class="card">
        <h2>FDV</h2>
        <div id="fdv" class="value">–</div>
    </div>

    <div class="card">
        <h2>BUY / SELL 24h</h2>
        <div class="value">
            <span id="buys24">–</span> /
            <span id="sells24">–</span>
        </div>
        <div style="margin-top:10px; font-size:26px; font-weight:bold; line-height:1.4;">
            <span id="buyVolume" style="color:#00ff99;">Acquisti: –</span><br>
            <span id="sellVolume" style="color:#ff4d4d;">Vendite: –</span>
        </div>
    </div>

    <div class="card">
        <h2>Total Supply</h2>
        <div id="totalSupply" class="value">–</div>
    </div>

    <div class="card">
        <h2>Circulating Supply</h2>
        <div id="circulatingSupply" class="value">–</div>
    </div>
</div>

<div class="card">
    <h2>Coppie DEX (Dexscreener)</h2>
    <table id="pairs">
        <tr>
            <th>DEX</th>
            <th>Coppia</th>
            <th>Prezzo</th>
            <th>24h %</th>
            <th>Volume 24h</th>
            <th>Liquidity</th>
        </tr>
    </table>
</div>

<script src="config.js"></script>

<script>
const TOKEN_MINT = "5bp5PwTyu4i1hGyQsRwRYqiR2CmxyHt2cPJGEbXEbonk";
const DS_URL = "https://api.dexscreener.com/latest/dex/tokens/" + TOKEN_MINT;

// Controllo config.js
let HELIUS_KEY = null;
if (typeof HELIUS_API_KEY !== "undefined") {
    HELIUS_KEY = HELIUS_API_KEY;
    document.getElementById("status").textContent = "config.js caricato correttamente";
    document.getElementById("status").className = "status-ok";
} else {
    document.getElementById("status").textContent =
        "Attenzione: config.js non trovato (supply non disponibile)";
    document.getElementById("status").className = "status-err";
}

function fmtUsd(v) {
    if (!v) return "–";
    const n = Number(v);
    if (n < 1) return "$" + n.toFixed(6);
    return "$" + n.toLocaleString();
}

function fmtNum(v) {
    if (!v && v !== 0) return "–";
    return Number(v).toLocaleString();
}

// ===============================
// SUPPLY via Helius REST API
// ===============================
async function loadSupply() {
    if (!HELIUS_KEY) return;

    try {
        const res = await fetch(
            "https://api.helius.xyz/v0/token-supply?api-key=" + HELIUS_KEY,
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mint: TOKEN_MINT })
            }
        );

        const data = await res.json();

        const total = data.totalSupply?.uiAmount ?? null;

        if (total !== null) {
            document.getElementById("totalSupply").textContent = fmtNum(total);

            // Formula Circulating Supply
            const circulating = total - 100_000_000;
            document.getElementById("circulatingSupply").textContent =
                circulating > 0 ? fmtNum(circulating) : "–";
        }
    } catch (err) {
        console.error("Errore supply:", err);
    }
}

// ===============================
// DEXSCREENER
// ===============================
async function loadDexscreener() {
    try {
        const res = await fetch(DS_URL);
        const data = await res.json();

        if (!data.pairs || data.pairs.length === 0) return;

        const p = data.pairs[0];

        document.getElementById("price").textContent =
            p.priceUsd ? "$" + Number(p.priceUsd).toFixed(8) : "–";

        document.getElementById("price-change").textContent =
            p.priceChange?.h24 !== undefined ? `24h: ${p.priceChange.h24}%` : "";

        document.getElementById("volume24").textContent = fmtUsd(p.volume?.h24);
        document.getElementById("liquidity").textContent = fmtUsd(p.liquidity?.usd);
        document.getElementById("fdv").textContent = fmtUsd(p.fdv);

        const buys = p.txns?.h24?.buys ?? 0;
        const sells = p.txns?.h24?.sells ?? 0;
        const totalVol = p.volume?.h24 ?? 0;

        document.getElementById("buys24").textContent = buys;
        document.getElementById("sells24").textContent = sells;

        if (buys + sells > 0 && totalVol > 0) {
            const buyVol = totalVol * (buys / (buys + sells));
            const sellVol = totalVol * (sells / (buys + sells));

            document.getElementById("buyVolume").textContent =
                "Acquisti: " + fmtUsd(buyVol);
            document.getElementById("sellVolume").textContent =
                "Vendite: " + fmtUsd(sellVol);
        }

        const table = document.getElementById("pairs");
        table.innerHTML = `
            <tr>
                <th>DEX</th>
                <th>Coppia</th>
                <th>Prezzo</th>
                <th>24h %</th>
                <th>Volume 24h</th>
                <th>Liquidity</th>
            </tr>
        `;

        data.pairs.forEach(pair => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${pair.dexId}</td>
                <td>${pair.baseToken?.symbol}/${pair.quoteToken?.symbol}</td>
                <td>${pair.priceUsd ? "$" + Number(pair.priceUsd).toFixed(8) : "–"}</td>
                <td>${pair.priceChange?.h24 ?? "–"}%</td>
                <td>${fmtUsd(pair.volume?.h24)}</td>
                <td>${fmtUsd(pair.liquidity?.usd)}</td>
            `;
            table.appendChild(tr);
        });

    } catch (err) {
        console.error("Errore Dexscreener:", err);
    }
}

function loadAll() {
    loadDexscreener();
    loadSupply();
}

loadAll();
setInterval(loadAll, 10000);
</script>

</body>
</html>
