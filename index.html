<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>BUMPER Fiodena Team Dashboard</title>

<style>
    body {
        background:#0b0d10;
        color:#e6e6e6;
        font-family:Arial, sans-serif;
        margin:0;
        padding:25px;
    }

    h1 {
        display:flex;
        align-items:center;
        gap:15px;
        margin-bottom:25px;
        font-size:28px;
        font-weight:bold;
    }

    #logo {
        width:70px;
        height:70px;
        border-radius:10px;
        object-fit:contain;
        background:#111;
    }

    .grid {
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
        gap:20px;
        margin-bottom:25px;
    }

    .card {
        background:#161a20;
        padding:20px;
        border-radius:12px;
        box-shadow:0 0 12px rgba(0,0,0,0.45);
        border:1px solid #222;
        transition:0.2s;
    }

    .card:hover {
        transform:scale(1.02);
        box-shadow:0 0 18px rgba(0,0,0,0.6);
    }

    .card h2 {
        margin:0 0 12px 0;
        font-size:18px;
        color:#9ecbff;
    }

    .value {
        font-size:28px;
        font-weight:bold;
        color:#ffffff;
    }

    table {
        width:100%;
        border-collapse:collapse;
        margin-top:12px;
        font-size:15px;
    }

    th, td {
        padding:10px 8px;
        border-bottom:1px solid #333;
    }

    th {
        background:#1e222a;
        color:#9ecbff;
        font-size:15px;
    }

    .green { color:#00ff99; font-weight:bold; }
    .red { color:#ff4d4d; font-weight:bold; }
</style>
</head>
<body>

<h1>
    <img id="logo" src="logo.png" alt="logo">
    <span>BUMPER Fiodena Team Dashboard</span>
</h1>

<div id="status" class="status-ok" style="margin-bottom:20px; font-size:18px; color:#00ff99;">
    Dashboard attiva
</div>

<div class="grid">

    <div class="card">
        <h2>Prezzo</h2>
        <div id="price" class="value">–</div>
        <div id="price-change" style="margin-top:8px; font-size:18px;"></div>
    </div>

    <div class="card">
        <h2>Volume 24h</h2>
        <div id="volume24" class="value">–</div>
    </div>

    <div class="card">
        <h2>Liquidità</h2>
        <div id="liquidity" class="value">–</div>
    </div>

    <div class="card">
        <h2>FDV</h2>
        <div id="fdv" class="value">–</div>
    </div>

    <div class="card">
        <h2>BUY / SELL 24h</h2>
        <div class="value" style="font-size:26px;">
            <span id="buys24">–</span> /
            <span id="sells24">–</span>
        </div>
        <div style="margin-top:12px; font-size:24px; font-weight:bold; line-height:1.5;">
            <span id="buyVolume" class="green">Acquisti: –</span><br>
            <span id="sellVolume" class="red">Vendite: –</span>
        </div>
    </div>

</div>

<div class="card">
    <h2>Coppie DEX (Dexscreener)</h2>
    <table id="pairs">
        <tr>
            <th>DEX</th>
            <th>Coppia</th>
            <th>Prezzo</th>
            <th>24h %</th>
            <th>Volume 24h</th>
            <th>Liquidity</th>
        </tr>
    </table>
</div>

<script>
const TOKEN_MINT = "5bp5PwTyu4i1hGyQsRwRYqiR2CmxyHt2cPJGEbXEbonk";
const DS_URL = "https://api.dexscreener.com/latest/dex/tokens/" + TOKEN_MINT;

function fmtUsd(v) {
    if (!v) return "–";
    const n = Number(v);
    if (n < 1) return "$" + n.toFixed(6);
    return "$" + n.toLocaleString();
}

async function loadDexscreener() {
    try {
        const res = await fetch(DS_URL);
        const data = await res.json();

        if (!data.pairs || data.pairs.length === 0) return;

        const p = data.pairs[0];

        // Prezzo
        const price = p.priceUsd ? Number(p.priceUsd) : null;
        document.getElementById("price").textContent =
            price ? "$" + price.toFixed(8) : "–";

        document.getElementById("price-change").textContent =
            p.priceChange?.h24 !== undefined ? `24h: ${p.priceChange.h24}%` : "";

        // Volume
        const vol24 = p.volume?.h24 ?? null;
        document.getElementById("volume24").textContent = fmtUsd(vol24);

        // Liquidity
        document.getElementById("liquidity").textContent = fmtUsd(p.liquidity?.usd);

        // FDV
        document.getElementById("fdv").textContent = fmtUsd(p.fdv);

        // BUY / SELL
        const buys = p.txns?.h24?.buys ?? 0;
        const sells = p.txns?.h24?.sells ?? 0;
        document.getElementById("buys24").textContent = buys;
        document.getElementById("sells24").textContent = sells;

        if (buys + sells > 0 && vol24 > 0) {
            const buyVol = vol24 * (buys / (buys + sells));
            const sellVol = vol24 * (sells / (buys + sells));

            document.getElementById("buyVolume").textContent =
                "Acquisti: " + fmtUsd(buyVol);
            document.getElementById("sellVolume").textContent =
                "Vendite: " + fmtUsd(sellVol);
        }

        // Tabella coppie
        const table = document.getElementById("pairs");
        table.innerHTML = `
            <tr>
                <th>DEX</th>
                <th>Coppia</th>
                <th>Prezzo</th>
                <th>24h %</th>
                <th>Volume 24h</th>
                <th>Liquidity</th>
            </tr>
        `;

        data.pairs.forEach(pair => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${pair.dexId}</td>
                <td>${pair.baseToken?.symbol}/${pair.quoteToken?.symbol}</td>
                <td>${pair.priceUsd ? "$" + Number(pair.priceUsd).toFixed(8) : "–"}</td>
                <td>${pair.priceChange?.h24 ?? "–"}%</td>
                <td>${fmtUsd(pair.volume?.h24)}</td>
                <td>${fmtUsd(pair.liquidity?.usd)}</td>
            `;
            table.appendChild(tr);
        });

    } catch (err) {
        console.error("Errore Dexscreener:", err);
    }
}

function loadAll() {
    loadDexscreener();
}

loadAll();
setInterval(loadAll, 10000);
</script>

</body>
</html>
