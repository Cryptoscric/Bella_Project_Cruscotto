<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUMPER Dashboard – Pro Edition</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

  <style>
    /* LAYOUT BASE */
    body {
      background: radial-gradient(circle at 20% 20%, #10131a, #050609);
      color: #e8e8e8;
      font-family: "Inter", -apple-system, sans-serif;
      padding: 15px;
      margin: 0;
      min-height: 100vh;
    }

    /* MENU PILLS */
    .menu {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      z-index: 100;
      padding: 10px 0;
      background: transparent;
    }
    .pill {
      padding: 8px 16px;
      border: 1px solid rgba(107, 182, 255, 0.4);
      border-radius: 20px;
      color: #b7d9ff;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      transition: 0.2s;
      backdrop-filter: blur(10px);
      background: rgba(10, 15, 25, 0.7);
      cursor: pointer;
    }
    .pill:hover, .pill.active {
      background: #6bb6ff;
      color: #050609;
      border-color: white;
    }

    /* HEADER */
    .header-container {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }
    #logo {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* GRID & CARDS */
    .grid-main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .card h2 { font-size: 12px; color: #9ecbff; text-transform: uppercase; margin: 0 0 10px 0; letter-spacing: 0.5px; opacity: 0.8; }
    .value { font-size: 22px; font-weight: 800; color: #fff; }

    /* UTILS */
    .green { color: #4aff8a; }
    .red { color: #ff5c5c; }
    .yellow { color: #ffd86b; }
    
    /* MINI CHART CONTAINER */
    .sentiment-box {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .chart-container {
      width: 90px;
      height: 90px;
      flex-shrink: 0;
    }

    /* VENDITA VIEW */
    .view { display: none; }
    .view.active { display: block; }
    .input-box {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
      background: #000; color: #fff; margin: 8px 0; box-sizing: border-box;
    }
    .quick-btn {
      padding: 6px 12px; background: #1a1e26; border: 1px solid #333;
      color: #fff; border-radius: 6px; cursor: pointer; margin: 5px 5px 0 0;
    }

    /* TABLES */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th { text-align: left; padding: 10px; border-bottom: 2px solid #333; color: #9ecbff; }
    td { padding: 10px; border-bottom: 1px solid #222; }
  </style>
</head>
<body>

  <div class="menu">
    <a class="pill active" data-view="dashboard">DASHBOARD</a>
    <a class="pill" data-view="vendita">VENDITA</a>
    <a class="pill" href="piano.html">PIANO</a>
  </div>

  <div class="header-container">
    <img id="logo" src="logo.png" alt="Logo">
    <h1 style="margin:0; font-size: 24px;">BUMPER <span style="font-weight:300">Terminal</span></h1>
  </div>

  <div id="viewDashboard" class="view active">
    <div class="grid-main">
      <div class="card">
        <h2>Prezzo Attuale</h2>
        <div id="price" class="value">$0.00000000</div>
        <div id="priceChange" style="font-size: 14px; margin-top: 4px;">0.00%</div>
      </div>
      <div class="card">
        <h2>Liquidity & Vol</h2>
        <div id="liquidity" class="value" style="font-size: 18px;">$0</div>
        <div id="volume24" style="font-size: 14px; margin-top: 4px; color: #aaa;">Vol 24h: $0</div>
      </div>
      <div class="card">
        <h2>Sentiment (24h)</h2>
        <div class="sentiment-box">
          <div class="chart-container">
            <canvas id="pieChart"></canvas>
          </div>
          <div>
            <div id="sentimentLabel" style="font-weight: 800; font-size: 14px; margin-bottom: 4px;">---</div>
            <div id="bs-stats" style="font-size: 12px; line-height: 1.4; color: #aaa;"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="grid-main" style="grid-template-columns: 1fr 2fr;">
      <div class="card">
        <h2>Breakdown Volumi</h2>
        <div id="vol-history" style="font-size:13px; line-height: 1.8;"></div>
      </div>
      <div class="card" style="overflow-x: auto;">
        <h2>DEX Pairs</h2>
        <table id="pairsTable">
          <thead>
            <tr><th>DEX</th><th>Pair</th><th>Price</th><th>Liquidity</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="viewVendita" class="view">
    <div class="card" style="max-width: 500px; margin: 0 auto;">
      <h2>Simulatore Exit Strategy</h2>
      
      <label style="font-size: 13px; color: #9ecbff;">Saldo BUMPER</label>
      <input id="userBalance" class="input-box" type="number" placeholder="Inserisci quanti token hai..." oninput="updateCustomSell()">
      
      <label style="font-size: 13px; color: #9ecbff;">Quantità da vendere</label>
      <input id="customSellInput" class="input-box" type="number" oninput="updateCustomSell()">
      
      <input id="customSlider" type="range" min="0" max="100" value="0" style="width:100%; margin: 10px 0;" oninput="sliderChanged()">
      
      <div style="margin-bottom: 20px;">
        <button class="quick-btn" onclick="quickSell(25)">25%</button>
        <button class="quick-btn" onclick="quickSell(50)">50%</button>
        <button class="quick-btn" onclick="quickSell(100)">MAX</button>
      </div>

      <div id="sellResults" style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); display:none">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px">
          <span>Incasso stimato:</span>
          <span id="resUSDC" class="green" style="font-weight:bold"></span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:8px">
          <span>Price Impact:</span>
          <span id="resImpact"></span>
        </div>
        <div style="display:flex; justify-content:space-between">
          <span>Tranche suggerite:</span>
          <span id="resTranche" class="yellow"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TOKEN_ADDR = "5bp5PwTyu4i1hGyQsRwRYqiR2CmxyHt2cPJGEbXEbonk";
    let globalData = { price: 0, liq: 0, vol: 0 };
    let chartInstance = null;

    // Helpers
    const fUsd = (n) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: n < 1 ? 4 : 0 }).format(n);
    const fCompact = (n) => new Intl.NumberFormat('en-US', { notation: "compact", compactDisplay: "short" }).format(n);

    async function fetchData() {
      try {
        const r = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${TOKEN_ADDR}`);
        const d = await r.json();
        if (!d.pairs) return;

        const main = d.pairs[0];
        globalData.price = parseFloat(main.priceUsd);
        globalData.liq = d.pairs.reduce((s, p) => s + (p.liquidity?.usd || 0), 0);
        globalData.vol = d.pairs.reduce((s, p) => s + (p.volume?.h24 || 0), 0);

        // Update UI
        document.getElementById('price').textContent = `$${globalData.price.toFixed(8)}`;
        document.getElementById('liquidity').textContent = fUsd(globalData.liq);
        document.getElementById('volume24').textContent = `Vol 24h: ${fUsd(globalData.vol)}`;
        
        const change = main.priceChange.h24;
        const pChangeEl = document.getElementById('priceChange');
        pChangeEl.textContent = `${change}% (24h)`;
        pChangeEl.className = change >= 0 ? 'green' : 'red';

        updateSentiment(d.pairs);
        updatePairsTable(d.pairs);
        updateVolumeList(d.pairs);
      } catch (e) { console.error("API Error", e); }
    }

    function updateSentiment(pairs) {
      const b = pairs.reduce((s, p) => s + (p.txns.h24.buys || 0), 0);
      const s = pairs.reduce((sum, p) => sum + (p.txns.h24.sells || 0), 0);
      const total = b + s;
      const buyPct = ((b/total)*100).toFixed(1);

      document.getElementById('sentimentLabel').innerHTML = b > s ? '<span class="green">BULLISH</span>' : '<span class="red">BEARISH</span>';
      document.getElementById('bs-stats').innerHTML = `Buy: ${b} (${buyPct}%)<br>Sell: ${s}`;

      const ctx = document.getElementById('pieChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [b, s],
            backgroundColor: ['#4aff8a', '#ff5c5c'],
            borderWidth: 0,
            hoverOffset: 2
          }]
        },
        options: {
          cutout: '75%',
          responsive: true,
          maintainAspectRatio: true,
          plugins: { legend: { display: false }, datalabels: { display: false } }
        }
      });
    }

    function updateVolumeList(pairs) {
      const v1 = pairs.reduce((s, p) => s + (p.volume.h1 || 0), 0);
      const v6 = pairs.reduce((s, p) => s + (p.volume.h6 || 0), 0);
      document.getElementById('vol-history').innerHTML = `
        <div style="display:flex;justify-content:space-between"><span>1h:</span><b>${fUsd(v1)}</b></div>
        <div style="display:flex;justify-content:space-between"><span>6h:</span><b>${fUsd(v6)}</b></div>
        <div style="display:flex;justify-content:space-between"><span>24h:</span><b>${fUsd(globalData.vol)}</b></div>
      `;
    }

    function updatePairsTable(pairs) {
      const tbody = document.querySelector('#pairsTable tbody');
      tbody.innerHTML = pairs.slice(0, 4).map(p => `
        <tr>
          <td>${p.dexId.toUpperCase()}</td>
          <td>${p.quoteToken.symbol}</td>
          <td>$${parseFloat(p.priceUsd).toFixed(6)}</td>
          <td>${fCompact(p.liquidity?.usd || 0)}</td>
        </tr>
      `).join('');
    }

    // Sell Logic
    function sliderChanged() {
      const bal = document.getElementById('userBalance').value;
      const pct = document.getElementById('customSlider').value;
      document.getElementById('customSellInput').value = Math.floor(bal * pct / 100);
      updateCustomSell();
    }
    function quickSell(p) { document.getElementById('customSlider').value = p; sliderChanged(); }
    
    function updateCustomSell() {
      const amt = document.getElementById('customSellInput').value;
      const res = document.getElementById('sellResults');
      if (!amt || amt <= 0) { res.style.display = 'none'; return; }

      res.style.display = 'block';
      const val = amt * globalData.price;
      const impact = (val / globalData.liq) * 100;

      document.getElementById('resUSDC').textContent = fUsd(val);
      document.getElementById('resImpact').textContent = `${impact.toFixed(2)}%`;
      document.getElementById('resImpact').className = impact > 1 ? 'red' : 'green';
      document.getElementById('resTranche').textContent = impact > 0.5 ? Math.ceil(impact/0.3) + " tranche" : "In blocco unico";
    }

    // SPA
    document.querySelectorAll('.pill[data-view]').forEach(p => {
      p.onclick = () => {
        document.querySelectorAll('.pill, .view').forEach(x => x.classList.remove('active'));
        p.classList.add('active');
        document.getElementById(`view${p.dataset.view.charAt(0).toUpperCase() + p.dataset.view.slice(1)}`).classList.add('active');
      };
    });

    fetchData();
    setInterval(fetchData, 20000);
  </script>
</body>
</html>
