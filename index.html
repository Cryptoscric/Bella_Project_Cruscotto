<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUMPER Terminal Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg: #05060b; --card-bg: rgba(13, 17, 28, 0.7); --accent: #6bb6ff; --green: #4aff8a; --red: #ff5c5c; --border: rgba(255, 255, 255, 0.08); }
    body { background: radial-gradient(circle at top right, #1a1f35, #05060b 60%); color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 20px; min-height: 100vh; }
    .menu { position: sticky; top: 0; display: flex; justify-content: flex-end; gap: 12px; z-index: 1000; padding: 15px 0; }
    .pill { padding: 10px 22px; border: 1px solid var(--border); border-radius: 12px; color: #94a3b8; text-decoration: none; font-weight: 700; font-size: 13px; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); transition: 0.3s; }
    .pill:hover, .pill.active { background: var(--accent); color: #000; border-color: #fff; box-shadow: 0 0 20px rgba(107, 182, 255, 0.4); }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 24px; backdrop-filter: blur(10px); transition: 0.3s; margin-bottom: 20px; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .value { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 800; }
    .section-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: #64748b; margin-bottom: 15px; display: block; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
    th { padding: 12px; font-size: 12px; color: #64748b; text-align: left; }
    td { padding: 16px; background: rgba(255,255,255,0.02); font-family: 'JetBrains Mono'; }
    .green { color: var(--green); } .red { color: var(--red); }
    @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="menu">
    <a href="index.html" class="pill active">TERMINAL</a>
    <a href="vendita.html" class="pill">STRATEGY</a>
    <a href="piano.html" class="pill">PLAN</a>
  </div>

  <header style="display:flex; align-items:center; gap:20px; margin-bottom:40px">
    <img src="logo.png" style="width:60px; height:60px; border-radius:15px; box-shadow: 0 0 30px rgba(107,182,255,0.2)">
    <div>
      <h1 style="margin:0; font-size:32px; font-weight:900;">BUMPER <span style="color:var(--accent)">OS</span></h1>
      <div style="font-size:12px; color:#64748b">SYSTEMS ONLINE - REAL-TIME FEED</div>
    </div>
  </header>

  <div class="dashboard-grid">
    <div class="card">
      <span class="section-title">Market Price</span>
      <div id="price" class="value">$0.00000000</div>
      <div id="priceChange" style="font-weight:700; margin-top:5px">--%</div>
    </div>
    <div class="card">
      <span class="section-title">Net Liquidity</span>
      <div id="liquidity" class="value">$0</div>
      <div id="fdv" style="font-size:12px; color:#64748b; margin-top:5px">FDV: --</div>
    </div>
    <div class="card">
      <span class="section-title">24h Sentiment</span>
      <div style="display:flex; align-items:center; gap:20px">
        <canvas id="pieChart" style="max-width:70px"></canvas>
        <div id="sentimentLabel" style="font-weight:900">--</div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <span class="section-title">DEX Execution Hub</span>
    <table>
      <thead><tr><th>DEX</th><th>POOL</th><th>PRICE</th><th>24H%</th><th>LIQUIDITY</th></tr></thead>
      <tbody id="pairsTable"></tbody>
    </table>
  </div>

  <script>
    const TOKEN = "5bp5PwTyu4i1hGyQsRwRYqiR2CmxyHt2cPJGEbXEbonk";
    let state = { chart: null };

    async function loadDex() {
      try {
        const r = await fetch("https://api.dexscreener.com/latest/dex/tokens/" + TOKEN);
        const d = await r.json();
        const best = d.pairs.sort((a,b) => (b.liquidity?.usd||0) - (a.liquidity?.usd||0))[0];
        
        const price = +best.priceUsd;
        const liq = d.pairs.reduce((a,p) => a + (p.liquidity?.usd||0), 0);

        // SALVATAGGIO PER ALTRE PAGINE
        localStorage.setItem("globalPrice", price);
        localStorage.setItem("globalLiquidity", liq);

        document.getElementById("price").textContent = "$" + price.toFixed(8);
        document.getElementById("liquidity").textContent = "$" + liq.toLocaleString();
        document.getElementById("priceChange").textContent = (best.priceChange.h24) + "%";
        document.getElementById("priceChange").className = best.priceChange.h24 >= 0 ? 'green' : 'red';
        document.getElementById("fdv").textContent = "FDV: $" + (best.fdv || 0).toLocaleString();

        updateSentiment(best.txns.h24.buys, best.txns.h24.sells);
        
        document.getElementById("pairsTable").innerHTML = d.pairs.slice(0,5).map(p => `
          <tr><td>${p.dexId.toUpperCase()}</td><td>${p.quoteToken.symbol}</td>
          <td>$${(+p.priceUsd).toFixed(6)}</td><td class="${p.priceChange.h24>=0?'green':'red'}">${p.priceChange.h24}%</td>
          <td>$${(p.liquidity?.usd || 0).toLocaleString()}</td></tr>
        `).join('');
      } catch(e) { console.error("Error fetching data"); }
    }

    function updateSentiment(b, s) {
      document.getElementById("sentimentLabel").innerHTML = b > s ? '<span class="green">BULLISH</span>' : '<span class="red">BEARISH</span>';
      if (state.chart) state.chart.destroy();
      state.chart = new Chart(document.getElementById('pieChart'), {
        type: 'doughnut',
        data: { datasets: [{ data: [b, s], backgroundColor: ['#4aff8a', '#ff5c5c'], borderWidth: 0 }] },
        options: { cutout: '70%', plugins: { legend: { display: false } } }
      });
    }

    loadDex();
    setInterval(loadDex, 15000);
  </script>
</body>
</html>
