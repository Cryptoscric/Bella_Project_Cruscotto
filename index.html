<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUMPER Terminal – Live</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg: #05060b; --card-bg: rgba(13, 17, 28, 0.7); --accent: #6bb6ff; --green: #4aff8a; --red: #ff5c5c; --border: rgba(255, 255, 255, 0.1); }
    body { background: radial-gradient(circle at top right, #1a1f35, #05060b 60%); color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 20px; }
    .menu { display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 30px; }
    .pill { padding: 10px 22px; border: 1px solid var(--border); border-radius: 12px; color: #94a3b8; text-decoration: none; font-weight: 700; font-size: 13px; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); }
    .pill.active { background: var(--accent); color: #000; border-color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 24px; backdrop-filter: blur(10px); }
    .value { font-family: 'JetBrains Mono'; font-size: 24px; font-weight: 800; margin: 10px 0; }
    .label { font-size: 11px; color: #64748b; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .green { color: var(--green); } .red { color: var(--red); }
    .chart-box { width: 70px; height: 70px; }
  </style>
</head>
<body>
  <div class="menu">
    <a href="index.html" class="pill active">TERMINAL</a>
    <a href="vendita.html" class="pill">STRATEGY</a>
    <a href="piano.html" class="pill">PLAN</a>
  </div>

  <div class="grid">
    <div class="card">
      <div class="label">Price BUMPER</div>
      <div id="price" class="value">$0.000000</div>
      <div id="priceChange" style="font-size:12px; font-weight:700">0%</div>
    </div>
    <div class="card">
      <div class="label">Liquidity Pool</div>
      <div id="liquidity" class="value">$0</div>
      <div id="fdv" style="font-size:12px; color:#64748b">FDV: --</div>
    </div>
    <div class="card" style="display:flex; align-items:center; gap:20px">
      <div class="chart-box"><canvas id="sentChart"></canvas></div>
      <div>
        <div id="sentLabel" style="font-weight:900; font-size:18px">--</div>
        <div id="txCount" style="font-size:10px; color:#64748b; font-family:'JetBrains Mono'"></div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <div class="label">Volume 24h & Trends (USDT)</div>
    <div id="volDetails" style="font-family:'JetBrains Mono'; margin-top:15px; line-height:2"></div>
  </div>

  <script>
    const TOKEN = "5bp5PwTyu4i1hGyQsRwRYqiR2CmxyHt2cPJGEbXEbonk";
    let chart;
    async function update() {
      const r = await fetch("https://api.dexscreener.com/latest/dex/tokens/"+TOKEN);
      const d = await r.json();
      const p = d.pairs[0];
      const liq = d.pairs.reduce((a,x) => a + (x.liquidity?.usd||0), 0);
      
      localStorage.setItem("globalPrice", p.priceUsd);
      localStorage.setItem("globalLiquidity", liq);

      document.getElementById("price").innerText = "$"+parseFloat(p.priceUsd).toFixed(8);
      document.getElementById("liquidity").innerText = "$"+Math.floor(liq).toLocaleString();
      document.getElementById("priceChange").innerText = p.priceChange.h24+"%";
      document.getElementById("priceChange").className = p.priceChange.h24 >= 0 ? "green" : "red";
      document.getElementById("fdv").innerText = "FDV: $"+Math.floor(p.fdv).toLocaleString();

      const b = p.txns.h24.buys, s = p.txns.h24.sells;
      document.getElementById("sentLabel").innerHTML = b>s ? '<span class="green">BULLISH</span>' : '<span class="red">BEARISH</span>';
      document.getElementById("txCount").innerText = `BUY: ${b} | SELL: ${s}`;
      
      document.getElementById("volDetails").innerHTML = `
        BUY VOL: <span class="green">$${Math.floor(p.volume.h24*(b/(b+s))).toLocaleString()}</span><br>
        SELL VOL: <span class="red">$${Math.floor(p.volume.h24*(s/(b+s))).toLocaleString()}</span><br>
        TOTAL: $${Math.floor(p.volume.h24).toLocaleString()}
      `;

      if(chart) chart.destroy();
      chart = new Chart(document.getElementById('sentChart'), {
        type: 'doughnut',
        data: { datasets: [{ data: [b, s], backgroundColor: ['#4aff8a', '#ff5c5c'], borderWidth: 0 }] },
        options: { cutout: '70%', plugins: { legend: { display: false } } }
      });
    }
    update(); setInterval(update, 15000);
  </script>
</body>
</html>
